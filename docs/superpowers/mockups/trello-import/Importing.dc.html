<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import from Trello — importing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.pb{height:44px;padding:0 24px;border-radius:12px;border:0;background:#E8821E;color:#3A1E00;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Hanken Grotesk',sans-serif;letter-spacing:.1px;white-space:nowrap}
.sub{font-size:12px;line-height:1.45;color:#6B5E52}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-top:1px solid #F4EDE3;font-size:14px}
.cnt{font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(43,32,24,.32); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-modal="true" aria-labelledby="dlg-t" style="width: 560px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,.14), 0 16px 28px rgba(82,58,34,.10); display: flex; flex-direction: column; overflow: hidden">

      <div style="display: flex; align-items: center; gap: 16px; padding: 20px 24px 12px">
        <span style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px; background: #DCEAF3; color: #2F5F80; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="3"/><path d="M8 7.5v8M12 7.5v4.5M16 7.5v6"/></svg></span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <h2 id="dlg-t" style="margin: 0; font: 600 20px/1.25 'Bricolage Grotesque', sans-serif; letter-spacing: -0.3px">Importing from Trello</h2>
          <p style="margin: 0; font-size: 14px; color: #6B5E52">Keep this open until it finishes.</p>
        </div>
      </div>

      <div style="padding: 8px 24px 20px; display: flex; flex-direction: column; gap: 16px">
        <div role="progressbar" aria-valuemin="0" aria-valuemax="229" aria-valuenow="128" aria-label="Writing cards" style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-weight: 600; font-size: 14px">Writing cards</span><span class="cnt" style="font-size: 14px; color: #6B5E52">128 of 229</span></div>
          <div style="height: 6px; border-radius: 3px; background: #F4EDE3; overflow: hidden"><div style="width: 56%; height: 100%; border-radius: 3px; background: #E8821E"></div></div>
        </div>

        <div style="border-radius: 12px; box-shadow: inset 0 0 0 1px #F4EDE3; overflow: hidden">
          <div class="row" style="border-top: 0">
            <span style="width: 28px; height: 28px; flex: 0 0 28px; border-radius: 14px; background: #DDEFE3; color: #1F6B40; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
            <span style="flex: 1 1 auto; font-weight: 600">Sales pipeline</span><span class="sub cnt">128 cards</span>
          </div>
          <div class="row">
            <span style="width: 28px; height: 28px; flex: 0 0 28px; display: inline-flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2.5px solid #F4EDE3; border-top-color: #E8821E; animation: spin .9s linear infinite"></span></span>
            <span style="flex: 1 1 auto; font-weight: 600">Sales pipeline · Checklist items</span><span class="sub cnt">Writing 46</span>
          </div>
          <div class="row" style="color: #6B5E52">
            <span style="width: 28px; height: 28px; flex: 0 0 28px; display: inline-flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; border: 2px solid #B6A593"></span></span>
            <span style="flex: 1 1 auto">Hiring</span><span class="sub cnt">37 cards</span>
          </div>
          <div class="row" style="color: #6B5E52">
            <span style="width: 28px; height: 28px; flex: 0 0 28px; display: inline-flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; border: 2px solid #B6A593"></span></span>
            <span style="flex: 1 1 auto">Hiring · Comments</span><span class="sub cnt">18 comments</span>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid #F4EDE3">
        <span style="flex: 1 1 auto; font-size: 13px; color: #6B5E52">Imported cards don't start automations.</span>
        <button class="pb" disabled="disabled" style="opacity: .38">Done</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
