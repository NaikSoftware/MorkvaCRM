<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import from Trello — done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.tb{height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:#8A4708;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Hanken Grotesk',sans-serif;letter-spacing:.1px;white-space:nowrap;text-decoration:none}
.pb{height:44px;padding:0 24px;border-radius:12px;border:0;background:#E8821E;color:#3A1E00;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Hanken Grotesk',sans-serif;letter-spacing:.1px;white-space:nowrap}
.sub{font-size:12px;line-height:1.45;color:#6B5E52}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 4px 4px 12px;border-top:1px solid #F4EDE3;font-size:14px}
.cnt{font-variant-numeric:tabular-nums}
.glyph{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:#DCEAF3;color:#2F5F80;display:inline-flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(43,32,24,.32); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-modal="true" aria-labelledby="dlg-t" style="width: 560px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,.14), 0 16px 28px rgba(82,58,34,.10); display: flex; flex-direction: column; overflow: hidden">

      <div style="display: flex; align-items: center; gap: 16px; padding: 20px 24px 12px">
        <span style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px; background: #FFE0C2; color: #4E2A00; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <h2 id="dlg-t" style="margin: 0; font: 600 20px/1.25 'Bricolage Grotesque', sans-serif; letter-spacing: -0.3px">Your boards are in</h2>
          <p class="cnt" style="margin: 0; font-size: 14px; color: #6B5E52">4 collections · 229 cards</p>
        </div>
      </div>

      <div style="padding: 8px 24px 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="border-radius: 12px; box-shadow: inset 0 0 0 1px #F4EDE3; overflow: hidden">
          <div class="row" style="border-top: 0">
            <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="3"/><path d="M8 7.5v8M12 7.5v4.5M16 7.5v6"/></svg></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">Sales pipeline</span><span class="sub cnt">128 cards · board view by List</span></span>
            <a href="#" class="tb">Open<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
          </div>
          <div class="row">
            <span class="glyph" style="background: #E3EEDB; color: #3B6128"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5l1.5 1.5L8.5 5M4 12.5l1.5 1.5 3-3M4 18.5l1.5 1.5 3-3M11.5 7h8.5M11.5 13h8.5M11.5 19h8.5"/></svg></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">Sales pipeline · Checklist items</span><span class="sub cnt">46 items</span></span>
            <a href="#" class="tb">Open<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
          </div>
          <div class="row">
            <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="3"/><path d="M8 7.5v8M12 7.5v4.5M16 7.5v6"/></svg></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">Hiring</span><span class="sub cnt">37 cards · board view by List</span></span>
            <a href="#" class="tb">Open<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
          </div>
          <div class="row">
            <span class="glyph" style="background: #EDE0EE; color: #6B3F70"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 5.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4.5 3.5v-3.5h-1a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/></svg></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">Hiring · Comments</span><span class="sub cnt">18 comments</span></span>
            <a href="#" class="tb">Open<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 12px; border-radius: 12px; background: #FBF7F2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 18px"><path d="M13.5 2.5L4.5 13.5H11l-1.5 8 9-11H12z"/></svg>
          <span style="flex: 1 1 auto; font-size: 13px; line-height: 1.45; color: #4A3D32">Used Butler in Trello? Set up the same steps as Morkva automations.</span>
          <a href="#" class="tb">Automations</a>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid #F4EDE3">
        <button class="pb">Done</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
