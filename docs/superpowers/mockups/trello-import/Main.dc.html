<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>

</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; display: flex; background: #FBF7F2; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018; overflow: hidden">

  <!-- Sidebar 272 (shell_sidebar.dart) — Settings selected via the profile row -->

        <svg width="24" height="24" viewBox="0.15 -1.9 24 24" aria-hidden="true"><path d="M4.5 19.5c2.6-1 8.3-5.6 10.3-8.6a2.7 2.7 0 0 0-3.7-3.7C8.1 9.2 3.5 14.9 2.5 17.5c-.4 1.1 1 2.4 2 2z" fill="#3A1E00"/><path d="M15.5 6.5l3.5-3.5M17 8.5l4-1.5M13.5 5l1.2-3.5" fill="none" stroke="#3A1E00" stroke-width="1.8" stroke-linecap="round"/></svg>

        <span style="font-size: 12px; color: #6B5E52; letter-spacing: 1.2px">CRM</span>
      </span>
    </div>
    <button style="display: flex; align-items: center; height: 44px; margin: -2px 0; padding: 0; border: 0; background: transparent; text-align: left"><span style="flex: 1 1 auto; display: flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box; padding: 0 8px 0 12px; border-radius: 12px; border: 1px solid #E0D5C7; background: #FBF7F2; color: #6B5E52; font: 400 14px 'Hanken Grotesk', sans-serif">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

      <kbd style="font: 600 11px 'Hanken Grotesk', sans-serif; color: #6B5E52; background: #F4EDE3; border: 1px solid #E0D5C7; border-radius: 6px; padding: 2px 6px">Ctrl K</kbd>
    </span></button>
    <button aria-pressed="false" style="display: flex; align-items: center; gap: 8px; height: 44px; margin-top: 8px; padding: 0 8px 0 12px; border-radius: 12px; border: 0; background: transparent; color: #2B2018; font: 600 14px 'Hanken Grotesk', sans-serif; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#8A4708" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5zM19 15.5c.3 2 1.2 2.9 3.2 3.2-2 .3-2.9 1.2-3.2 3.2-.3-2-1.2-2.9-3.2-3.2 2-.3 2.9-1.2 3.2-3.2z"/></svg>
      <span style="flex: 1 1 auto">Ask Morkva</span>
      <kbd style="font: 600 11px 'Hanken Grotesk', sans-serif; color: #6B5E52; border: 1px solid #E0D5C7; border-radius: 6px; padding: 2px 6px">Ctrl J</kbd>
    </button>
    <div style="height: 8px"></div>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 8px; margin: 0 0 2px; border-radius: 14px; font: 500 14px 'Hanken Grotesk', sans-serif; color: #2B2018; text-decoration: none">
      <span style="width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px; background: #E8821E; color: #3A1E00; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span>
      <span style="flex: 1 1 auto">All collections</span>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 8px; margin: 0 0 2px; border-radius: 14px; font: 500 14px 'Hanken Grotesk', sans-serif; color: #2B2018; text-decoration: none">
      <span style="width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px; background: #EEE5D8; color: #4E2A00; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 2.5L4.5 13.5H11l-1.5 8 9-11H12z"/></svg></span>
      <span style="flex: 1 1 auto">Automations</span>
    </a>
    <div style="padding: 16px 4px 4px 12px"><p style="font: 700 11px 'Hanken Grotesk', sans-serif; letter-spacing: .9px; text-transform: uppercase; color: #6B5E52; margin: 0">Pinned</p></div>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 8px; margin: 0 0 2px; border-radius: 14px; font: 500 14px 'Hanken Grotesk', sans-serif; color: #2B2018; text-decoration: none"><span style="width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px; background: #FFE0C2; color: #8A4708; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg></span><span style="flex: 1 1 auto">Orders</span></a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 8px; margin: 0 0 2px; border-radius: 14px; font: 500 14px 'Hanken Grotesk', sans-serif; color: #2B2018; text-decoration: none"><span style="width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px; background: #E3EEDB; color: #3B6128; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5"/></svg></span><span style="flex: 1 1 auto">Clients</span></a>
    <span style="flex: 1 1 auto"></span>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0 0 4px; border-top: 1px solid #E0D5C7">
      <span style="width: 34px; height: 34px; flex: 0 0 34px; border-radius: 17px; background: #4C7A34; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 14px 'Hanken Grotesk', sans-serif">OK</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto">
        <span style="font-size: 14px; font-weight: 600">Olena Kovalenko</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #2E6B45"><span style="width: 7px; height: 7px; border-radius: 4px; background: #2E8B57"></span>Synced</span>
      </span>
      <button aria-label="Settings" aria-current="page" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #8A4708; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 3px 6px rgba(74,53,32,.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </nav>

  <!-- Settings page (settings_page.dart): slim header, sections of ListTileCards; title, labels, cards and Sign out share one 16 px left edge -->
  <main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 12px 16px 24px; display: flex; flex-direction: column">
    <h1 style="margin: 0 0 24px; font: 600 24px/1.25 'Bricolage Grotesque', sans-serif; letter-spacing: -0.3px">Settings</h1>
    <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px">

      <section aria-labelledby="sec-ws" style="display: flex; flex-direction: column; gap: 8px">
        <h2 id="sec-ws" style="margin: 0; font: 700 11px 'Hanken Grotesk', sans-serif; letter-spacing: .9px; text-transform: uppercase; color: #6B5E52">Workspace</h2>
        <a href="#" style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 12px 12px 12px 16px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 3px 6px rgba(74,53,32,.06); color: #2B2018; text-decoration: none">
          <span style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; background: #FFE0C2; color: #4E2A00; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 2.5L4.5 13.5H11l-1.5 8 9-11H12z"/></svg></span>
          <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 16px/1.3 'Hanken Grotesk', sans-serif">Automations</span><span style="font-size: 12px; line-height: 1.45; color: #6B5E52">Modules, buttons and runs</span></span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </section>

      <section aria-labelledby="sec-imp" style="display: flex; flex-direction: column; gap: 8px">
        <h2 id="sec-imp" style="margin: 0; font: 700 11px 'Hanken Grotesk', sans-serif; letter-spacing: .9px; text-transform: uppercase; color: #6B5E52">Import from other apps</h2>
        <a href="#" style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 12px 12px 12px 16px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 3px 6px rgba(74,53,32,.06); color: #2B2018; text-decoration: none">
          <span style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; background: #DCEAF3; color: #2F5F80; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3.5" width="18" height="17" rx="3"/><path d="M8 7.5v8M12 7.5v4.5M16 7.5v6"/></svg></span>
          <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 16px/1.3 'Hanken Grotesk', sans-serif">Trello</span><span style="font-size: 12px; line-height: 1.45; color: #6B5E52">Boards become collections — lists, cards, labels, checklists and comments</span></span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </section>

      <section aria-labelledby="sec-acc" style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
        <h2 id="sec-acc" style="margin: 0; font: 700 11px 'Hanken Grotesk', sans-serif; letter-spacing: .9px; text-transform: uppercase; color: #6B5E52">Account</h2>
        <button style="height: 44px; padding: 0 24px; border-radius: 12px; border: 1px solid #E0D5C7; background: #E8DECD; color: #2B2018; display: inline-flex; align-items: center; gap: 8px; font: 600 14px 'Hanken Grotesk', sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H15M10 16l4-4-4-4M14 12H4"/></svg>Sign out</button>

    </div>
  </main>
</div>
