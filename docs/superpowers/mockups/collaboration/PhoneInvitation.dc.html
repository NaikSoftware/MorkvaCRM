<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone invitation on Home</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Roboto+Mono:wght@500&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
svg{flex:0 0 auto}
/* ---------- shell: sidebar (shell_sidebar.dart, full 272) ---------- */
.side{width:272px;flex:0 0 272px;box-sizing:border-box;background:#F4EDE3;display:flex;flex-direction:column;padding:16px 12px 12px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 6px 0 8px;margin:0 0 2px;border-radius:14px;border:0;background:transparent;width:100%;text-align:left;font:500 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;color:#2B2018;box-sizing:border-box;text-decoration:none}
.nav[aria-current="page"]{background:#FFFFFF;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 6px rgba(74,53,32,.06)}
.tile{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.cap{font:700 11px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.9px;text-transform:uppercase;color:#6B5E52;margin:0}
.ib{width:44px;height:44px;flex:0 0 44px;border-radius:22px;border:0;padding:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
kbd{font:600 11px 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52;border:1px solid #E0D5C7;border-radius:6px;padding:2px 6px}
/* ---------- avatars (UserAvatar: initials disc; me = leaf) ---------- */
.av{width:28px;height:28px;flex:0 0 28px;border-radius:50%;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font:700 11px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.2px}
.av-me{background:#4C7A34;color:#FFFFFF}
.av-sky{background:#DCEAF3;color:#2F5F80}
.av-plum{background:#EDE0EE;color:#6B3F70}
.av-sand{background:#F6EBC8;color:#6E5310}
.av-more{background:#EEE5D8;color:#4A4036}
.pile{display:inline-flex;align-items:center}
.pile .av{position:relative;box-shadow:0 0 0 2px #FBF7F2}
.pile .av:nth-child(1){z-index:4}.pile .av:nth-child(2){z-index:3}.pile .av:nth-child(3){z-index:2}.pile .av:nth-child(4){z-index:1}
.pile .av+.av{margin-left:-4px}
.pop .pile .av{box-shadow:0 0 0 2px #FFFFFF}
/* ---------- buttons (design/components/buttons + theme OutlinedButton) ---------- */
.btn{height:44px;flex:0 0 auto;padding:0 24px;border-radius:12px;border:0;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;white-space:nowrap;cursor:pointer}
.btn-icon{padding-left:20px}
.btn-primary{background:#E8821E;color:#3A1E00}
.btn-outlined{background:transparent;color:#2B2018;border:1px solid #B6A593}
.btn-outlined[aria-expanded="true"]{background:#E8DECD}
.btn-outlined .chev{display:inline-flex;color:#6B5E52;margin-right:-8px}
.btn-sm{padding:0 16px}
.btn-text{height:44px;flex:0 0 auto;padding:0 12px;border-radius:12px;border:0;background:transparent;color:#8A4708;display:inline-flex;align-items:center;gap:6px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;white-space:nowrap;cursor:pointer}
.btn-text.danger{color:#C0392B}
.hit{flex:0 0 auto;min-width:44px;min-height:44px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
/* ---------- collection page: header, view tabs, toolbar ---------- */
.page-hd{display:flex;align-items:center;gap:8px;padding:24px 24px 8px}
.glyph{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center}
.page-title{flex:1 1 auto;min-width:0;margin:0 0 0 4px;font:600 24px/1.2 'Bricolage Grotesque','Onest',sans-serif;letter-spacing:-0.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #E0D5C7;margin:0 24px}
.tab{position:relative;height:48px;padding:0 12px;border:0;background:transparent;display:inline-flex;align-items:center;gap:8px;font:500 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;color:#6B5E52;border-radius:8px;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:#2B2018;font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#E8821E}
.tab-more{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#6B5E52}
.toolbar{height:52px;display:flex;align-items:center;gap:8px;padding:0 24px}
.fchip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 12px;box-sizing:border-box;border-radius:8px;background:#FFE0C2;color:#4E2A00;font:600 14px 'Hanken Grotesk','Onest',sans-serif;white-space:nowrap}
.fchip-x{width:44px;height:44px;flex:0 0 44px;margin:-8px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#4E2A00}
.fadd{height:32px;padding:0 12px 0 8px;border-radius:8px;border:1px dashed #B6A593;color:#6B5E52;display:inline-flex;align-items:center;gap:4px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;box-sizing:border-box}
.tcluster{display:inline-flex;align-items:center;height:36px;border-radius:12px;border:1px solid rgba(182,165,147,.6);padding:0 4px}
.tbtn{min-width:44px;min-height:44px;margin:-4px 0;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
.tbtn>span{height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;white-space:nowrap}
.tbtn i{display:inline-flex;color:#6B5E52;font-style:normal}
.tsep{width:1px;height:20px;background:#E0D5C7}
/* ---------- table (modes/table_mode.dart: header 44, rows 52) ---------- */
.tbl{margin:0 24px;border-radius:16px;border:1px solid #E0D5C7;background:#FFFFFF;overflow:hidden}
.tr{display:grid;grid-template-columns:264px 160px 136px 200px 128px minmax(0,1fr);height:52px;border-bottom:1px solid #E0D5C7}
.tr.th{height:44px;background:#FAF4EC}
.th>div{display:flex;align-items:center;gap:4px;padding:0 12px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;color:#6B5E52}
.th>div:first-child{padding-left:16px}
.td{display:flex;align-items:center;min-width:0;padding:0 12px;font:400 14px/1.45 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td.title{padding-left:16px;font-weight:600}
.num{justify-content:flex-end !important}
.tfoot{height:36px;display:flex;align-items:center;padding:0 16px;background:#FAF4EC;font:600 12px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.2px;color:#6B5E52;font-variant-numeric:tabular-nums}
/* OptionPill: 24 tall, full radius, 8 px dot, option colour @16% on white */
.opt{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;box-sizing:border-box;border-radius:12px;font:600 12px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.2px;color:#2B2018;white-space:nowrap}
.opt::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--dot)}
.o-new{background:#DFEAF1;--dot:#3A7CA5}
.o-cutting{background:#F8F0DA;--dot:#D4A017}
.o-sewing{background:#FBEBDB;--dot:#E8821E}
.o-ready{background:#E2EADF;--dot:#4C7A34}
.o-shipped{background:#E7E5E3;--dot:#6B5E52}
/* ---------- share popover (view_popover.dart pattern, 400 wide) ---------- */
.anchor{position:relative;display:inline-flex;flex:0 0 auto}
.pop{position:absolute;top:calc(100% + 4px);right:0;z-index:5;width:400px;box-sizing:border-box;background:#FFFFFF;border:1px solid #E0D5C7;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.14),0 16px 28px rgba(82,58,34,.10);text-align:left;font:400 14px/1.45 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;white-space:normal}
.pop-hd{display:flex;align-items:center;gap:8px;padding:8px 6px 0 20px}
.pop-title{flex:1 1 auto;min-width:0;margin:0;font:600 16px/1.35 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-sec{padding:4px 20px 16px}
.sec-lbl{display:block;margin:0 0 8px;font:600 14px/1.3 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;color:#2B2018}
.hint{margin:0;font:400 12px/1.45 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52}
.field{flex:1 1 auto;min-width:0;height:44px;display:flex;align-items:center;box-sizing:border-box;border:0;box-shadow:inset 0 0 0 1px #B6A593;border-radius:12px;background:#FFFFFF}
.field input{flex:1 1 auto;min-width:0;height:44px;border:0;outline:0;background:transparent;padding:0 0 0 14px;font:400 14px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.field input::placeholder{color:#6B5E52;opacity:1}
.inline-sel{height:44px;flex:0 0 auto;padding:0 8px 0 12px;border:0;border-left:1px solid #E0D5C7;border-radius:0 12px 12px 0;background:transparent;display:inline-flex;align-items:center;gap:2px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;cursor:pointer}
.inline-sel i,.sel i{display:inline-flex;color:#6B5E52;font-style:normal}
.people{display:flex;align-items:center;gap:8px;margin:8px -8px -4px 0}
.people-txt{flex:1 1 auto;min-width:0;white-space:nowrap;font:400 14px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;font-variant-numeric:tabular-nums}
.people-txt b{font-weight:600}
.pop-div{height:1px;background:#E0D5C7;margin:0}
.access{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px 6px 6px;margin:0 -6px;box-sizing:content-box;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer}
.acc-ic{width:36px;height:36px;flex:0 0 36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center}
.acc-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.acc-name{display:inline-flex;align-items:center;gap:2px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;color:#2B2018}
.acc-name i{display:inline-flex;color:#6B5E52;font-style:normal}
.quiet{margin-top:8px;padding:4px 12px 8px 16px;border-radius:12px;background:#FAF4EC}
.q-row{display:flex;align-items:center;gap:10px;min-height:44px}
.q-row+.q-row{border-top:1px solid #EEE5D8}
.q-ic{display:inline-flex;color:#6B5E52}
.q-txt{flex:1 1 auto;min-width:0;font:400 14px/1.4 'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.q-txt small{display:block;font-size:12px;line-height:1.45;color:#6B5E52}
.url{flex:1 1 auto;min-width:0;font:500 13px 'Roboto Mono',ui-monospace,monospace;color:#2B2018;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{min-height:44px;flex:0 0 auto;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;cursor:pointer}
.sel>span{height:36px;padding:0 6px 0 12px;box-sizing:border-box;border:1px solid #B6A593;border-radius:12px;background:#FFFFFF;display:inline-flex;align-items:center;gap:4px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.sw{width:52px;min-height:44px;flex:0 0 auto;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.sw>span{position:relative;width:52px;height:32px;box-sizing:border-box;border-radius:16px;border:2px solid #6B5E52;background:#E8DECD}
.sw>span::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:8px;background:#6B5E52}
.q-actions{display:flex;align-items:center;gap:4px;margin:0 0 -4px -12px}
.dot{width:8px;height:8px;flex:0 0 8px;border-radius:4px}
.note{display:flex;align-items:flex-start;gap:8px;margin:12px 0 0;font:400 12px/1.45 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52}
.note svg{margin-top:1px}
.pop-ft{display:flex;align-items:center;gap:16px;padding:12px 16px 12px 20px;border-top:1px solid #E0D5C7}
.pop-ft .hint{flex:1 1 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- workspace glyph (square = workspace, circle = person) ---------- */
.ws{width:38px;height:38px;flex:0 0 38px;box-sizing:border-box;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font:700 14px 'Bricolage Grotesque','Onest',sans-serif;letter-spacing:-.2px}
.ws-mw{background:#E8821E;color:#3A1E00}
.role{display:inline-flex;align-items:center;height:20px;padding:0 8px;box-sizing:border-box;border-radius:10px;font:600 11px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.3px;white-space:nowrap;flex:0 0 auto}
.r-owner{background:#FFE0C2;color:#4E2A00}
.ws-tf{background:#D8EEEA;color:#23605A}
/* ---------- phone home (collections_list_view.dart compact) ---------- */
.ccard{height:176px;box-sizing:border-box;display:flex;flex-direction:column;padding:16px 4px 16px 16px;border-radius:16px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 6px rgba(74,53,32,.06);min-width:0}
.cglyph{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center}
.cname{margin:8px 0 0;font:600 18px/1.25 'Bricolage Grotesque','Onest',sans-serif;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.cmeta{font:600 12px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.2px;color:#6B5E52;font-variant-numeric:tabular-nums}
.cib{width:44px;height:44px;flex:0 0 44px;margin:-4px 0;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#6B5E52}
.cib>span{width:36px;height:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center}
.pcap{display:flex;align-items:center;gap:6px;margin:0;padding:20px 4px 8px}
.navbar{flex:0 0 80px;display:flex;background:#F4EDE3}
.dest{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;padding:0;font:600 12px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.2px;color:#6B5E52;text-decoration:none;cursor:pointer}
.dest>span{width:64px;height:32px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center}
.dest[aria-current="page"]{color:#2B2018}
.dest[aria-current="page"]>span{background:#FFE0C2;color:#4E2A00}
.btn-36{height:44px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;cursor:pointer;flex:0 0 auto}
.btn-36>span{height:36px;padding:0 16px;box-sizing:border-box;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;white-space:nowrap}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #FBF7F2; font-family: 'Hanken Grotesk','Onest', sans-serif; color: #2B2018; overflow: hidden">

  <!-- shell _PageHeader (compact): workspace switcher as the title; Ask + avatar trailing -->
  <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 8px 12px 8px 12px">
    <button aria-haspopup="menu" aria-expanded="false" aria-label="Workspace: Nadia’s workspace, Owner. Switch workspace" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 4px 8px 4px 4px; border: 0; border-radius: 14px; background: transparent; text-align: left; cursor: pointer; color: #2B2018">
      <span class="ws ws-tf" style="width: 34px; height: 34px; flex-basis: 34px; border-radius: 11px; font-size: 13px">N</span>
      <span style="min-width: 0; font: 600 20px/1.25 'Bricolage Grotesque','Onest', sans-serif; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nadia’s workspace</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button aria-label="Ask Morkva" style="width: 44px; height: 44px; flex: 0 0 44px; border: 0; border-radius: 14px; background: #FFE0C2; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#8A4708" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5zM19 15.5c.3 2 1.2 2.9 3.2 3.2-2 .3-2.9 1.2-3.2 3.2-.3-2-1.2-2.9-3.2-3.2 2-.3 2.9-1.2 3.2-3.2z"/></svg>
    </button>
    <button aria-label="Account and settings" style="position: relative; width: 44px; height: 44px; flex: 0 0 44px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
      <span class="av av-me" style="width: 34px; height: 34px; flex-basis: 34px; font-size: 14px">N</span>
      <span style="position: absolute; right: 3px; bottom: 4px; width: 11px; height: 11px; box-sizing: border-box; border-radius: 6px; background: #2E8B57; border: 2px solid #FBF7F2"></span>
    </button>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column">

    <!-- NEW: pending-invite banner (spec §6: top of All collections, info tint; signed in as nadia@morkvawear.com) -->
    <section role="region" aria-label="Invitation" style="border-radius: 12px; background: #DCEAF3; color: #2B2018; padding: 16px 12px 8px 16px">
      <div style="display: flex; gap: 12px; align-items: flex-start">
        <span class="ws ws-mw" style="width: 40px; height: 40px; flex-basis: 40px">M</span>
        <p style="flex: 1 1 auto; min-width: 0; margin: 0; padding-right: 4px; font: 400 14px/1.45 'Hanken Grotesk','Onest', sans-serif"><b style="font-weight: 600">Olena Koval</b> (olena@morkvawear.com) invited you to <b style="font-weight: 600">Morkva Wear</b> as an Editor.</p>
      </div>
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 8px">
        <button class="btn-36"><span style="color: #2F5F80; padding: 0 12px">Not now</span></button>
        <button class="btn-36"><span style="background: #E8821E; color: #3A1E00">Join</span></button>
      </div>
    </section>

    <!-- compact header row: filter, From template (outlined), New collection (filled) -->
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 16px">
      <label style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; border: 1px solid #E0D5C7; background: #FFFFFF; color: #6B5E52">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input aria-label="Filter collections" placeholder="Filter collections" style="height: 42px; flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 14px 'Hanken Grotesk','Onest', sans-serif; color: #2B2018">
      </label>
      <button aria-label="From template" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 22px; border: 1px solid #B6A593; background: transparent; color: #2B2018; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="16" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
