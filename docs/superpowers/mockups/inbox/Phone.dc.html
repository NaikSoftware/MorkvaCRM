<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.ib{width:44px;height:44px;flex:0 0 44px;border-radius:22px;border:0;padding:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.hit{flex:0 0 auto;min-width:44px;min-height:44px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:inherit;font:inherit}
.tb{height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:#8A4708;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;white-space:nowrap;flex:0 0 auto;cursor:pointer}
.ob{display:inline-flex;align-items:center;height:32px;padding:0 12px;box-sizing:border-box;border-radius:8px;box-shadow:inset 0 0 0 1px #B6A593;font:600 14px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.wd{height:56px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Hanken Grotesk','Onest',sans-serif;color:#2B2018;min-width:44px}
.wv{width:44px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-sizing:border-box}
.wv .w{font:600 11px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.3px;color:#6B5E52}
.wv .d{font:600 16px/20px 'Hanken Grotesk','Onest',sans-serif;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;height:4px;margin-top:1px}
.dot{width:4px;height:4px;border-radius:2px;background:#E8821E}
.wv.sel{background:#E8821E;color:#3A1E00}
.wv.sel .w{color:#3A1E00}
.wv.sel .dot{background:#3A1E00}
.comp{background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 6px rgba(74,53,32,.06)}
.cin{flex:1 1 auto;min-width:0;height:44px;border:0;outline:none;background:transparent;padding:0;font:400 16px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.cin::placeholder{color:#6B5E52}
.sh{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 0 0 12px}
.shl{margin:0;font:700 12px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#6B5E52}
.shl .n{font-weight:600;font-variant-numeric:tabular-nums}
.list{background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 6px rgba(74,53,32,.06);overflow:hidden}
.it{display:flex;align-items:center;gap:2px;min-height:48px;padding:2px 6px 2px 2px;box-sizing:border-box;border-top:1px solid #F4EDE3}
.it.first{border-top:0}
.cb{width:20px;height:20px;border-radius:10px;border:2px solid #6B5E52;box-sizing:border-box;display:block}
.lead{width:44px;height:44px;flex:0 0 44px;display:inline-flex;align-items:center;justify-content:center}
.ng{width:24px;height:24px;border-radius:7px;background:#F8EED1;color:#7A5A0C;display:inline-flex;align-items:center;justify-content:center}
.tt{flex:1 1 auto;min-width:0;min-height:44px;border:0;background:transparent;padding:4px 6px 4px 0;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;cursor:pointer;font-family:'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.t1{display:flex;align-items:baseline;gap:8px;min-width:0;font:500 15px 'Hanken Grotesk','Onest',sans-serif}
.t1 .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tm{flex:0 0 auto;font:600 14px 'Hanken Grotesk','Onest',sans-serif;font-variant-numeric:tabular-nums}
.meta{display:inline-flex;align-items:center;gap:4px;font:600 12px 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52;white-space:nowrap;font-variant-numeric:tabular-nums}
.lc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 4px;box-sizing:border-box;border-radius:8px;background:#F4EDE3;font:600 12px 'Hanken Grotesk','Onest',sans-serif;color:#4A3D32;white-space:nowrap;max-width:112px;overflow:hidden;text-overflow:ellipsis}
.mt{width:20px;height:20px;flex:0 0 20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:12px 0 16px;font:600 12px 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52;cursor:pointer}
.tab .ind{position:relative;width:64px;height:32px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center}
.tab .lb{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #FBF7F2; font-family: 'Hanken Grotesk','Onest', sans-serif; color: #2B2018; overflow: hidden">

  <!-- Phone header (_PageHeader): logomark · title · Ask Morkva · avatar -->
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; flex: 0 0 auto">
    <span style="width: 34px; height: 34px; flex: 0 0 34px; border-radius: 11px; background: #E8821E; display: inline-flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0.15 -1.9 24 24" aria-hidden="true"><path d="M4.5 19.5c2.6-1 8.3-5.6 10.3-8.6a2.7 2.7 0 0 0-3.7-3.7C8.1 9.2 3.5 14.9 2.5 17.5c-.4 1.1 1 2.4 2 2z" fill="#3A1E00"/><path d="M15.5 6.5l3.5-3.5M17 8.5l4-1.5M13.5 5l1.2-3.5" fill="none" stroke="#3A1E00" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <h1 style="margin: 0; flex: 1 1 auto; font: 600 20px/44px 'Bricolage Grotesque','Onest', sans-serif; letter-spacing: -0.3px">Inbox</h1>
    <button class="ib" aria-label="Ask Morkva" style="color: #8A4708; background: #FFE0C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5zM19 15.5c.3 2 1.2 2.9 3.2 3.2-2 .3-2.9 1.2-3.2 3.2-.3-2-1.2-2.9-3.2-3.2 2-.3 2.9-1.2 3.2-3.2z"/></svg></button>
    <button aria-label="Account and settings" style="position: relative; width: 44px; height: 44px; flex: 0 0 44px; border: 0; padding: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 34px; height: 34px; border-radius: 17px; background: #4C7A34; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 13px 'Hanken Grotesk','Onest', sans-serif">OK</span><span style="position: absolute; right: 4px; bottom: 5px; width: 10px; height: 10px; border-radius: 5px; background: #2E8B57; border: 2px solid #FBF7F2"></span></button>
  </header>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 2px; flex: 0 0 auto">
      <button class="tb" aria-label="November 2026, pick a date" style="color: #2B2018; font-size: 16px; padding: 0 8px 0 4px; margin-left: -4px; gap: 4px">November 2026<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <span style="flex: 1 1 auto"></span>
      <button class="ib" aria-label="Previous week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="hit" disabled="disabled" aria-label="Today, already showing" style="padding: 0 2px; cursor: default; opacity: .38"><span class="ob">Today</span></button>
      <button class="ib" aria-label="Next week" style="margin-right: -8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <!-- Week strip; swipe moves a week -->
    <div role="group" aria-label="Week of 9 November 2026" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin-top: 2px; flex: 0 0 auto">
      <button class="wd" aria-label="Monday 9, 1 item"><span class="wv"><span class="w">Mon</span><span class="d">9</span><span class="dots"><span class="dot"></span></span></span></button>
      <button class="wd" aria-label="Tuesday 10"><span class="wv"><span class="w">Tue</span><span class="d">10</span><span class="dots"></span></span></button>
      <button class="wd" aria-label="Wednesday 11, 2 items"><span class="wv"><span class="w">Wed</span><span class="d">11</span><span class="dots"><span class="dot"></span><span class="dot"></span></span></span></button>
      <button class="wd" aria-label="Thursday 12, 1 item"><span class="wv"><span class="w">Thu</span><span class="d">12</span><span class="dots"><span class="dot"></span></span></span></button>
      <button class="wd" aria-label="Friday 13"><span class="wv"><span class="w">Fri</span><span class="d">13</span><span class="dots"></span></span></button>
      <button class="wd" aria-current="date" aria-pressed="true" aria-label="Saturday 14, today, 3 items"><span class="wv sel"><span class="w">Sat</span><span class="d">14</span><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></span></button>
      <button class="wd" aria-label="Sunday 15, 2 items"><span class="wv"><span class="w">Sun</span><span class="d">15</span><span class="dots"><span class="dot"></span><span class="dot"></span></span></span></button>
    </div>

    <div class="comp" style="display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 14px 0 4px; margin-top: 12px; flex: 0 0 auto">
      <button class="hit" aria-label="Task — switch to note"><span class="cb" style="border-color: #B6A593"></span></button>
      <input class="cin" type="text" aria-label="Add a task for today" placeholder="Add a task for today…">
    </div>

    <!-- Rows: title line + meta line; the link chip shows the collection glyph + card label -->
    <section aria-labelledby="ph-over" style="margin-top: 8px; flex: 0 0 auto">
      <div class="sh"><h2 id="ph-over" class="shl" style="color: #C0392B">Overdue <span class="n">· 1</span></h2><span style="flex: 1 1 auto"></span><button class="tb" style="margin-right: -8px">Move all to today</button></div>
      <div class="list">
        <div class="it first">
          <button class="hit" aria-label="Mark done: Call Iryna about the fabric"><span class="cb"></span></button>
          <button class="tt"><span class="t1"><span class="x">Call Iryna about the fabric</span></span><span class="meta" style="color: #C0392B">2 d late</span></button>
          <a href="#" class="hit" aria-label="Open Orders · #1042"><span class="lc"><span class="mt" style="background: #FFE0C2; color: #8A4708"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg></span>#1042</span></a>
        </div>
      </div>
    </section>

    <section aria-labelledby="ph-day" style="margin-top: 4px; flex: 0 0 auto">
      <div class="sh"><h2 id="ph-day" class="shl" style="color: #8A4708">Today <span class="n">· 3</span></h2></div>
      <div class="list">
        <div class="it first">
          <button class="hit" aria-label="Mark done: Pay the Textile Co invoice"><span class="cb"></span></button>
          <button class="tt"><span class="t1"><span class="tm" style="color: #C0392B">09:30</span><span class="x">Pay the Textile Co invoice</span></span><span class="meta"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>15 min +1</span></button>
          <a href="#" class="hit" aria-label="Open Suppliers · Textile Co"><span class="lc"><span class="mt" style="background: #DCEAF3; color: #2F5F80"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20.5V10l5.5 3.5V10l5.5 3.5V4.5h6.5v16zM2 20.5h20"/></svg></span>Textile Co</span></a>
        </div>
        <div class="it">
          <span class="lead"><span class="ng" role="img" aria-label="Note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/></svg></span></span>
          <button class="tt"><span class="t1"><span class="tm">10:00</span><span class="x">Courier picks up #1042</span></span><span class="meta"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>At start</span></button>
          <a href="#" class="hit" aria-label="Open Orders · #1042"><span class="lc"><span class="mt" style="background: #FFE0C2; color: #8A4708"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg></span>#1042</span></a>
        </div>
        <div class="it">
          <button class="hit" aria-label="Mark done: Prepare samples for Iryna"><span class="cb"></span></button>
          <button class="tt"><span class="t1"><span class="x">Prepare samples for Iryna</span></span><span class="meta"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>Morning of</span></button>
          <a href="#" class="hit" aria-label="Open Clients · Iryna Melnyk"><span class="lc"><span class="mt" style="background: #E3EEDB; color: #3B6128"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5"/></svg></span>Iryna Melnyk</span></a>
        </div>
      </div>
    </section>

    <section aria-labelledby="ph-nd" style="margin-top: 4px; flex: 0 0 auto">
      <div class="sh" style="padding-left: 0"><h2 id="ph-nd" class="shl"><button aria-expanded="true" aria-label="No date, 3 items, collapse" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px 0 8px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>No date <span class="n">· 3</span></button></h2></div>
      <div class="list">
        <div class="it first">
          <span class="lead"><span class="ng" role="img" aria-label="Note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/></svg></span></span>
          <button class="tt"><span class="t1"><span class="x">Door code 4512</span></span></button>
        </div>
        <div class="it">
          <span class="lead"><span class="ng" role="img" aria-label="Note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/></svg></span></span>
          <button class="tt"><span class="t1"><span class="x">Iryna prefers Viber</span></span></button>
          <a href="#" class="hit" aria-label="Open Clients · Iryna Melnyk"><span class="lc"><span class="mt" style="background: #E3EEDB; color: #3B6128"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5"/></svg></span>Iryna Melnyk</span></a>
        </div>
        <div class="it">
          <button class="hit" aria-label="Mark done: Ask Max for the new price list"><span class="cb"></span></button>
          <button class="tt"><span class="t1"><span class="x">Ask Max for the new price list</span></span></button>
        </div>
      </div>
    </section>
  </div>

  <!-- Bottom NavigationBar: Inbox · first 3 pins · All; badge = overdue + due-today tasks -->
  <nav aria-label="Main" style="display: flex; padding: 0 8px; background: #F4EDE3; border-top: 1px solid #E0D5C7; flex: 0 0 auto">
    <button class="tab" aria-current="page" style="color: #2B2018"><span class="ind" style="background: #FFE0C2; color: #4E2A00"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 5h13L21 13v6H3v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg><span aria-label="3 due" style="position: absolute; top: 0; left: 36px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #E8821E; color: #3A1E00; display: inline-flex; align-items: center; justify-content: center; font: 700 11px 'Hanken Grotesk','Onest', sans-serif; font-variant-numeric: tabular-nums">3</span></span><span class="lb">Inbox</span></button>
    <button class="tab"><span class="ind"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg></span><span class="lb">Orders</span></button>
    <button class="tab"><span class="ind"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5"/></svg></span><span class="lb">Clients</span></button>
    <button class="tab"><span class="ind"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20.5V10l5.5 3.5V10l5.5 3.5V4.5h6.5v16zM2 20.5h20"/></svg></span><span class="lb">Suppliers</span></button>
    <button class="tab"><span class="ind"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span><span class="lb">All</span></button>
  </nav>
</div>
</x-dc>
