<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox — phone editor sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.ib{width:44px;height:44px;flex:0 0 44px;border-radius:22px;border:0;padding:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.hit{flex:0 0 auto;min-width:44px;min-height:44px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:inherit;font:inherit}
.tb{height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:#8A4708;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;white-space:nowrap;flex:0 0 auto;cursor:pointer}
.pb{height:44px;padding:0 24px;border-radius:12px;border:0;background:#E8821E;color:#3A1E00;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.1px;white-space:nowrap;flex:0 0 auto;cursor:pointer}
.ob{display:inline-flex;align-items:center;height:32px;padding:0 12px;box-sizing:border-box;border-radius:8px;box-shadow:inset 0 0 0 1px #B6A593;font:600 14px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.wd{height:56px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Hanken Grotesk','Onest',sans-serif;color:#2B2018;min-width:44px}
.wv{width:44px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-sizing:border-box}
.wv .w{font:600 11px 'Hanken Grotesk','Onest',sans-serif;letter-spacing:.3px;color:#6B5E52}
.wv .d{font:600 16px/20px 'Hanken Grotesk','Onest',sans-serif;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;height:4px;margin-top:1px}
.dot{width:4px;height:4px;border-radius:2px;background:#E8821E}
.wv.sel{background:#E8821E;color:#3A1E00}
.wv.sel .w{color:#3A1E00}
.wv.sel .dot{background:#3A1E00}
.cb{width:20px;height:20px;border-radius:10px;border:2px solid #6B5E52;box-sizing:border-box;display:block}
.ng{width:24px;height:24px;border-radius:7px;background:#F8EED1;color:#7A5A0C;display:inline-flex;align-items:center;justify-content:center}
.mt{width:20px;height:20px;flex:0 0 20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.er{display:flex;align-items:flex-start;gap:6px}
.er>.ic{width:28px;height:44px;flex:0 0 28px;display:inline-flex;align-items:center;justify-content:center;color:#6B5E52}
.ec{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.ln{display:flex;align-items:center;gap:2px;min-height:44px;flex-wrap:wrap}
.pc{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;box-sizing:border-box;border-radius:8px;box-shadow:inset 0 0 0 1px #E0D5C7;font:600 13px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;white-space:nowrap}
.pc.on{background:#FFE0C2;box-shadow:none;color:#4E2A00}
.cs{display:inline-flex;align-items:center;height:32px;border-radius:8px;background:#F4EDE3;flex:0 0 auto}
.cs .v{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:-6px 0;padding:0 2px 0 10px;border:0;background:transparent;font:600 13px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer;flex:0 0 auto;text-decoration:none}
.cs .v svg{color:#6B5E52}
.cs .x{width:44px;height:44px;flex:0 0 44px;margin:-6px 0;padding:0;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.hint{margin:0;font:400 12px/1.45 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF7F2; font-family: 'Hanken Grotesk','Onest', sans-serif; color: #2B2018">

  <!-- Inbox behind (as Phone) -->
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 16px">
    <span style="width: 34px; height: 34px; flex: 0 0 34px; border-radius: 11px; background: #E8821E; display: inline-flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0.15 -1.9 24 24" aria-hidden="true"><path d="M4.5 19.5c2.6-1 8.3-5.6 10.3-8.6a2.7 2.7 0 0 0-3.7-3.7C8.1 9.2 3.5 14.9 2.5 17.5c-.4 1.1 1 2.4 2 2z" fill="#3A1E00"/><path d="M15.5 6.5l3.5-3.5M17 8.5l4-1.5M13.5 5l1.2-3.5" fill="none" stroke="#3A1E00" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <h1 style="margin: 0; flex: 1 1 auto; font: 600 20px/44px 'Bricolage Grotesque','Onest', sans-serif; letter-spacing: -0.3px">Inbox</h1>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: #FFE0C2"></span>
    <span style="width: 34px; height: 34px; margin: 5px; border-radius: 17px; background: #4C7A34"></span>
  </header>
  <div style="padding: 0 16px">
    <div style="display: flex; align-items: center; height: 44px; font: 600 16px 'Hanken Grotesk','Onest', sans-serif">November 2026</div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
      <span class="wd"><span class="wv"><span class="w">Mon</span><span class="d">9</span><span class="dots"><span class="dot"></span></span></span></span>
      <span class="wd"><span class="wv"><span class="w">Tue</span><span class="d">10</span><span class="dots"></span></span></span>
      <span class="wd"><span class="wv"><span class="w">Wed</span><span class="d">11</span><span class="dots"><span class="dot"></span><span class="dot"></span></span></span></span>
      <span class="wd"><span class="wv"><span class="w">Thu</span><span class="d">12</span><span class="dots"><span class="dot"></span></span></span></span>
      <span class="wd"><span class="wv"><span class="w">Fri</span><span class="d">13</span><span class="dots"></span></span></span>
      <span class="wd"><span class="wv sel"><span class="w">Sat</span><span class="d">14</span><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></span></span>
      <span class="wd"><span class="wv"><span class="w">Sun</span><span class="d">15</span><span class="dots"><span class="dot"></span><span class="dot"></span></span></span></span>
    </div>
  </div>

  <!-- Modal barrier (showModalBottomSheet default, black54) -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.54)"></div>

  <!-- Full-height bottom sheet on the root navigator; paper fill like the wide dialog -->
  <section role="dialog" aria-modal="true" aria-label="Edit task: Pay the Textile Co invoice" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: #FBF7F2; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; overflow: hidden">
    <div aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: rgba(107,94,82,.4); margin: 12px 0 4px; flex: 0 0 auto"></div>
    <header style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px 16px; border-bottom: 1px solid #E0D5C7; flex: 0 0 auto">
      <span role="radiogroup" aria-label="Kind" style="display: inline-flex; align-items: center; height: 44px; flex: 0 0 auto; border-radius: 22px; background: #F4EDE3">
        <button role="radio" aria-checked="true" aria-label="Task" class="hit" style="border-radius: 22px"><span style="width: 36px; height: 36px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 3px 6px rgba(74,53,32,.06); display: inline-flex; align-items: center; justify-content: center"><span class="cb"></span></span></button>
        <button role="radio" aria-checked="false" aria-label="Note" class="hit" style="border-radius: 22px"><span class="ng" style="background: transparent; color: #6B5E52"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/></svg></span></button>
      </span>
      <input type="text" aria-label="Title" value="Pay the Textile Co invoice" style="flex: 1 1 auto; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; padding: 0; font: 600 18px 'Bricolage Grotesque','Onest', sans-serif; letter-spacing: -0.2px; color: #2B2018">
      <button class="ib" aria-label="Close" style="color: #2B2018"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>

    <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 8px">
      <label style="display: block">
        <span style="position: absolute; left: -9999px">Details</span>
        <textarea rows="3" placeholder="Details (optional)" style="display: block; width: 100%; min-height: 84px; box-sizing: border-box; resize: none; padding: 10px 12px; border: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px #E0D5C7; background: #FFFFFF; font: 400 16px/1.45 'Hanken Grotesk','Onest', sans-serif; color: #2B2018; outline: none">Invoice TC-2211 · 18 400 ₴. Pay from the shop account, send the receipt to Max.</textarea>
      </label>

      <div class="er" style="margin-top: 4px">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
        <div class="ec">
          <div class="ln">
            <span style="flex: 1 1 auto; font: 600 15px 'Hanken Grotesk','Onest', sans-serif; font-variant-numeric: tabular-nums">Sat 14 Nov</span>
            <span class="cs"><button class="v" aria-label="Time: 09:30"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>09:30</button><button class="x" aria-label="Clear time"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
          </div>
          <div class="ln" role="group" aria-label="Date presets" style="margin-left: -6px">
            <button class="hit" aria-pressed="true"><span class="pc on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Today</span></button>
            <button class="hit"><span class="pc">Tomorrow</span></button>
            <button class="hit"><span class="pc">Next Mon</span></button>
            <button class="hit"><span class="pc">Pick…</span></button>
          </div>
        </div>
      </div>

      <!-- Reminders; permission line in its denied state -->
      <div class="er">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></span>
        <div class="ec">
          <div class="ln" style="gap: 4px">
            <span class="cs"><button class="v" aria-label="Reminder: at time">At start</button><button class="x" aria-label="Remove reminder at time"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
            <span class="cs"><button class="v" aria-label="Reminder: 15 min before">15 min before</button><button class="x" aria-label="Remove reminder 15 min before"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
            <button class="hit" aria-label="Add a reminder"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 8px; box-shadow: inset 0 0 0 1px #E0D5C7; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
          </div>
          <p class="hint" style="display: flex; gap: 6px; align-items: flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 14px; margin-top: 2px"><path d="M6 16v-5a6 6 0 0 1 9.5-4.9M18 11v5l1.5 2H8M10 20.5a2 2 0 0 0 4 0M4 4l16 16"/></svg><span>Notifications are blocked for this site — reminders show only inside Morkva.</span></p>
        </div>
      </div>

      <div class="er" style="margin-top: 4px">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg></span>
        <div class="ec">
          <div class="ln">
            <span class="cs"><a href="#" class="v" aria-label="Open Suppliers · Textile Co"><span class="mt" style="background: #DCEAF3; color: #2F5F80"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20.5V10l5.5 3.5V10l5.5 3.5V4.5h6.5v16zM2 20.5h20"/></svg></span>Suppliers · Textile Co</a><button class="x" aria-label="Remove link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
          </div>
        </div>
      </div>
    </div>

    <footer style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid #E0D5C7; flex: 0 0 auto">
      <button class="tb" style="color: #C0392B; margin-left: -8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete</button>
      <span style="flex: 1 1 auto"></span>
      <button class="pb">Save</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
