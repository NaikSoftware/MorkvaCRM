<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculated field — formula</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.lbl{font:600 13px 'Hanken Grotesk',sans-serif;color:#6B5E52;margin:0}
.field{min-height:48px;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid #B6A593;background:#FFFFFF;display:flex;align-items:center;font:500 15px 'Hanken Grotesk',sans-serif;color:#2B2018}
.seg{flex:1 1 0;height:40px;border:0;background:transparent;font:600 14px 'Hanken Grotesk',sans-serif;color:#6B5E52;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid #E0D5C7;background:#FFFFFF;font:500 13px 'Hanken Grotesk',sans-serif;color:#2B2018}
.fn{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;border:0;background:#F4EDE3;font:500 12px 'JetBrains Mono',monospace;color:#2B2018}
.ref{background:#FFE0C2;color:#4E2A00;border-radius:6px;padding:1px 5px}
</style>
</helmet>
<div style="width: 440px; height: 860px; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #E0D5C7; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid #F4EDE3">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFE0C2; color: #8A4708; display: inline-flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 5H7l5 7-5 7h11"/></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto">
      <h2 style="margin: 0; font: 700 20px 'Bricolage Grotesque', sans-serif">Line total</h2>
      <span style="font-size: 13px; color: #6B5E52">Calculated · Number</span>
    </div>
    <button aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>

  <div style="flex: 1 1 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="nm">Name</label>
      <div class="field" id="nm">Line total</div>
    </div>

    <div role="radiogroup" aria-label="Calculate with" style="display: flex; padding: 4px; border-radius: 24px; background: #F4EDE3; gap: 4px">
      <button class="seg" role="radio" aria-checked="true" style="background: #FFFFFF; color: #2B2018; box-shadow: 0 1px 2px rgba(43,32,24,.12)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 5H7l5 7-5 7h11"/></svg>Formula</button>
      <button class="seg" role="radio" aria-checked="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Aggregate</button>
    </div>
    <p style="margin: -8px 0 0; font-size: 13px; color: #6B5E52">Computes from this item's own fields.</p>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="fx">Formula</label>
      <div id="fx" style="box-sizing: border-box; min-height: 96px; padding: 12px 14px; border-radius: 12px; border: 2px solid #E8821E; background: #FFFFFF; font: 400 15px/1.7 'JetBrains Mono', monospace; color: #2B2018">ROUND(<span class="ref">{Price}</span> * <span class="ref">{Quantity}</span> * (1 - <span class="ref">{Discount %}</span> / 100), 2)</div>
      <div style="display: flex; align-items: center; gap: 6px; font: 600 13px 'Hanken Grotesk', sans-serif; color: #2E7048">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
        Number · e.g. 1,215.00 ₴ for “Hoodie black M”
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <p class="lbl">Insert field</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="chip">Price</button>
        <button class="chip">Quantity</button>
        <button class="chip">Discount %</button>
        <button class="chip">Status</button>
        <button class="chip">Due date</button>
        <button class="chip">Paid</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <p class="lbl">Functions</p>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button class="fn">IF</button><button class="fn">ROUND</button><button class="fn">MIN</button><button class="fn">MAX</button><button class="fn">AND</button><button class="fn">OR</button><button class="fn">TODAY</button><button class="fn">&amp; join</button><button class="fn">more…</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label class="lbl" for="dp">Decimals</label>
        <div class="field" id="dp">2</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label class="lbl" for="un">Unit</label>
        <div class="field" id="un">₴</div>
      </div>
    </div>
  </div>

  <footer style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid #F4EDE3">
    <button style="height: 40px; padding: 0 20px; border-radius: 20px; border: 0; background: transparent; color: #8A4708; font: 600 14px 'Hanken Grotesk', sans-serif">Cancel</button>
    <button style="height: 40px; padding: 0 24px; border-radius: 20px; border: 0; background: #E8821E; color: #2B2018; font: 700 14px 'Hanken Grotesk', sans-serif">Done</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
