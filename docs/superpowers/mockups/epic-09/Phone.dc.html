<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone card actions sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 6px 0 8px;margin:0 0 2px;border-radius:14px;border:0;background:transparent;width:100%;text-align:left;font:500 14px 'Hanken Grotesk',sans-serif;letter-spacing:.1px;color:#2B2018;box-sizing:border-box;text-decoration:none}
.nav:hover{background:rgba(255,255,255,.55)}
.tile{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.cap{font:700 11px 'Hanken Grotesk',sans-serif;letter-spacing:.9px;text-transform:uppercase;color:#6B5E52;margin:0}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center}
.tab{position:relative;height:48px;padding:0 12px;border:0;background:transparent;display:inline-flex;align-items:center;gap:8px;font:500 14px 'Hanken Grotesk',sans-serif;letter-spacing:.1px;color:#6B5E52;border-radius:8px}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;font:600 12px 'Hanken Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px 0 8px;box-sizing:border-box;border-radius:12px;font:600 12px 'Hanken Grotesk',sans-serif;letter-spacing:.2px;white-space:nowrap}
.npill{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;box-sizing:border-box;border-radius:12px;font:600 12px 'Hanken Grotesk',sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.mod{display:flex;gap:16px;padding:16px;border-radius:16px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 6px rgba(74,53,32,.06);color:#2B2018;text-decoration:none}
.mod:hover{box-shadow:0 2px 4px rgba(0,0,0,.10),0 8px 14px rgba(82,58,34,.08)}
.meta{display:flex;align-items:flex-start;gap:8px;font:400 12px/1.45 'Hanken Grotesk',sans-serif;color:#6B5E52}
.meta svg{flex:0 0 14px;margin-top:2px}
.card{background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 6px rgba(74,53,32,.06)}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;border-top:1px solid #F4EDE3;font-size:14px}
.lbl{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:600 14px 'Hanken Grotesk',sans-serif;letter-spacing:.1px;color:#6B5E52}
.box{min-height:48px;box-sizing:border-box;padding:0 16px;border-radius:12px;border:1px solid #B6A593;background:#FFFFFF;display:flex;align-items:center;gap:8px;font:400 16px 'Hanken Grotesk',sans-serif;color:#2B2018}
.opt{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;box-sizing:border-box;border-radius:12px;font:600 12px 'Hanken Grotesk',sans-serif;letter-spacing:.2px;color:#2B2018}
.act{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px;box-sizing:border-box;border:0;border-radius:16px;background:transparent;text-align:left;font-family:'Hanken Grotesk',sans-serif;color:#2B2018}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #FBF7F2; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018">

  <!-- Card editor (compact): Scaffold + AppBar, as object_editor.dart compact -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; height: 56px; padding: 0 8px 0 4px; border-bottom: 1px solid #E0D5C7; flex: 0 0 auto">
      <button class="ib" aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; color: #2B2018"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h1 style="margin: 0; flex: 1 1 auto; min-width: 0; font: 600 18px/1.3 'Bricolage Grotesque', sans-serif; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#1042</h1>
      <!-- ⚡ Actions (IconActionButton), left of Save; only when the collection has card buttons -->
      <button class="ib" aria-label="Actions" aria-haspopup="dialog" aria-expanded="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 2.5L4.5 13.5H11l-1.5 8 9-11H12z"/></svg></button>
      <span style="width: 4px"></span>
      <button style="height: 44px; padding: 0 24px; border-radius: 12px; border: 0; background: #E8821E; color: #3A1E00; display: inline-flex; align-items: center; gap: 8px; font: 600 14px 'Hanken Grotesk', sans-serif; letter-spacing: .1px">Save</button>
    </header>

    <div style="flex: 1 1 auto; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div>
        <p class="lbl">Status</p>
        <button class="box" style="width: 100%; justify-content: space-between; text-align: left"><span class="opt" style="background: #F8EED1"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D4A017"></span>Packed</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div>
        <p class="lbl">Shipped on</p>
        <button class="box" style="width: 100%; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span style="color: #6B5E52">Pick a date</span></button>
      </div>
      <div>
        <p class="lbl">Client</p>
        <span style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px 0 12px; border-radius: 8px; background: #F4EDE3; font: 600 14px 'Hanken Grotesk', sans-serif">Iryna Melnyk<button aria-label="Remove Iryna Melnyk" style="width: 44px; height: 44px; flex: 0 0 44px; margin: -8px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button></span>
      </div>
      <div>
        <p class="lbl">Total</p>
        <span class="box" style="font-variant-numeric: tabular-nums"><span style="flex: 1 1 auto">2150</span><span style="color: #6B5E52; font-size: 14px">₴</span></span>
      </div>
      <div>
        <!-- changed field: the editor's 6 px primary dot after the label = unsaved form -->
        <p class="lbl">Notes<span role="img" aria-label="Changed" style="width: 6px; height: 6px; border-radius: 3px; background: #E8821E"></span></p>
        <span class="box" style="min-height: 72px; align-items: flex-start; padding-top: 12px; line-height: 1.5">Gift wrap, no invoice in the box</span>
      </div>
    </div>
  </div>

  <!-- Modal barrier: onSurface @ 32% -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,32,24,.32)"></div>

  <!-- Actions bottom sheet (M3 modal sheet: surfaceContainerLow, radius 28, drag handle) -->
  <section role="dialog" aria-modal="true" aria-labelledby="act-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FAF4EC; border-radius: 28px 28px 0 0; box-shadow: 0 -2px 12px rgba(74,53,32,.10); display: flex; flex-direction: column; padding: 0 0 28px">
    <div aria-hidden="true" style="align-self: center; width: 32px; height: 4px; border-radius: 2px; background: rgba(107,94,82,.4); margin: 16px 0 12px"></div>
    <div style="padding: 0 24px 12px; display: flex; flex-direction: column; gap: 4px">
      <h2 id="act-title" style="margin: 0; font: 600 20px/1.25 'Bricolage Grotesque', sans-serif; letter-spacing: -0.3px">Actions</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B5E52">The action works on the saved card.</p>
    </div>

    <div role="list" style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px">
      <!-- runs: unsaved form → "Save and run" subtitle; selecting saves first -->
      <button role="listitem" class="act" aria-label="Mark shipped. Save and run. Stamp shipped date">
        <span style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; background: #D8EEEA; color: #23605A; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7M6 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM17 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4z"/></svg></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font: 600 16px/1.3 'Hanken Grotesk', sans-serif">Mark shipped</span>
          <span style="font-size: 14px; line-height: 1.4; color: #6B5E52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 600; color: #2B2018">Save and run</span> · Stamp shipped date</span>
        </span>
      </button>

      <!-- needs consent: amber dot on the icon; opens the consent sheet, so it doesn't save -->
      <button role="listitem" class="act" aria-label="Draft thank-you. Needs consent. Thank-you note">
        <span style="position: relative; width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; background: #EDE0EE; color: #6B3F70; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg><span style="position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 5px; background: #D4A017; box-shadow: 0 0 0 2px #FAF4EC"></span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font: 600 16px/1.3 'Hanken Grotesk', sans-serif">Draft thank-you</span>
          <span style="font-size: 14px; line-height: 1.4; color: #6B5E52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 600; color: #5A4410">Needs consent</span> · Thank-you note</span>
        </span>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
