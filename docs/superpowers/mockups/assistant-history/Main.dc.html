<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation history — light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center;flex:0 0 40px}
</style>
</helmet>
<div style="width: 440px; height: 760px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Hanken Grotesk','Onest', sans-serif; color: #2B2018; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; height: 60px; flex: 0 0 60px; padding: 0 8px 0 18px; border-bottom: 1px solid #EEE5D8">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#E8821E" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5z"/></svg>
    <span style="flex: 1 1 auto; font: 700 16px 'Bricolage Grotesque','Onest', sans-serif">Ask Morkva</span>
    <button class="ib" aria-label="Back to the conversation" aria-pressed="true" style="background: #FFE0C2; color: #8A4708"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4M12 8v4l3 2"/></svg></button>
    <button class="ib" aria-label="Close assistant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div style="flex: 1 1 auto; background: #FBF7F2; padding: 14px; display: flex; flex-direction: column">
    <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid #E0D5C7; background: #FFFFFF; color: #6B5E52"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input aria-label="Search conversations" placeholder="Search conversations" style="border: 0; outline: 0; background: transparent; font: 500 14px 'Hanken Grotesk','Onest', sans-serif; flex: 1 1 auto"></label>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 8px; padding: 16px 4px 8px">
          <h2 style="margin: 0; font: 700 11px 'Hanken Grotesk','Onest', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6B5E52">{{g.label}}</h2>
          <span style="font: 600 11px 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">{{g.count}}</span>
          <span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: #E0D5C7"></span>
        </div>
        <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E0D5C7; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.rows}}" as="c" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; background: {{c.bg}}">
            <sc-if value="{{c.divider}}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="height: 1px; margin-left: 16px; background: #E0D5C7"></span>
            </sc-if>
            <div style="display: flex; align-items: center; min-height: 56px; padding: 0 4px 0 16px; gap: 8px">
              <button style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border: 0; background: transparent; text-align: left; font-family: inherit; color: inherit">
                <span style="display: flex; align-items: baseline; gap: 8px; width: 100%">
                  <span style="flex: 1 1 auto; min-width: 0; font: 600 14px 'Hanken Grotesk','Onest', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
                  <span style="flex: 0 0 auto; font: 500 12px 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">{{c.time}}</span>
                </span>
                <sc-if value="{{c.hasSnippet}}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 12px; color: #6B5E52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{c.snippet}}</span>
                </sc-if>
              </button>
              <button class="ib" aria-label="Delete conversation" style="opacity: {{c.del}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5"/></svg></button>
            </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":760}}'>
class Component extends DCLogic {
renderVals() {
  // state: 'current' (open conversation), 'hover' (mouse over: delete shows), '' (rest).
  const row = (title, time, snippet, state, i) => ({
    title, time, snippet, hasSnippet: !!snippet, divider: i > 0,
    bg: state === 'current' ? '#FCF0E4' : state === 'hover' ? '#F7F6F6' : 'transparent',
    del: state === 'hover' ? 1 : 0
  });
  const group = (label, rows) => ({ label, count: String(rows.length), rows: rows.map((r, i) => row(...r, i)) });
  return {
    groups: [
      group('Today', [
        ['Unpaid orders this month', '12:40', '3 changes applied', 'current'],
        ['Revenue by month', '10:05', 'chart', 'hover'],
        ['Suppliers collection', '09:20', 'Created Suppliers with 4 fields and linked it to Products.', '']
      ]),
      group('Yesterday', [
        ['Low stock fabrics', '16:00', '', ''],
        ['Clean up test orders', '11:00', '7 deleted', '']
      ]),
      group('3 Nov', [
        ['Import price list', '15:32', 'table', '']
      ])
    ]
  };
}
}
</script>
</body>
</html>
