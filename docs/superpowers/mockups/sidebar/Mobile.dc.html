<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone collections with pinned bottom bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.cap{font:700 11px 'Hanken Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6B5E52;margin:0}
.tile{border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:10px 0 6px;font:600 12px 'Hanken Grotesk',sans-serif;color:#6B5E52;min-width:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FBF7F2; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px">
    <span style="width: 34px; height: 34px; border-radius: 11px; background: #E8821E; display: inline-flex; align-items: center; justify-content: center">
      <svg width="21" height="21" viewBox="0.15 -1.9 24 24" aria-hidden="true"><path d="M4.5 19.5c2.6-1 8.3-5.6 10.3-8.6a2.7 2.7 0 0 0-3.7-3.7C8.1 9.2 3.5 14.9 2.5 17.5c-.4 1.1 1 2.4 2 2z" fill="#3A1E00"/><path d="M15.5 6.5l3.5-3.5M17 8.5l4-1.5M13.5 5l1.2-3.5" fill="none" stroke="#3A1E00" stroke-width="1.8" stroke-linecap="round"/></svg>
    </span>
    <h1 style="margin: 0; flex: 1 1 auto; font: 700 24px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.4px">Collections</h1>
    <button aria-label="Account and settings" style="position: relative; width: 44px; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center"><span style="width: 34px; height: 34px; border-radius: 17px; background: #4C7A34; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 13px 'Hanken Grotesk', sans-serif">OK</span><span style="position: absolute; right: 4px; bottom: 5px; width: 10px; height: 10px; border-radius: 5px; background: #2E8B57; border: 2px solid #FBF7F2"></span></button>
  </header>

  <div style="padding: 0 16px 12px; display: flex; gap: 8px; align-items: center">
    <label style="flex: 1 1 auto; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 14px; background: #F4EDE3; color: #6B5E52">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input aria-label="Filter collections" placeholder="Filter collections" style="border: 0; outline: 0; background: transparent; font: 500 15px 'Hanken Grotesk', sans-serif; flex: 1 1 auto; min-width: 0">
    </label>
    <button aria-label="From template" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #B6A593; background: transparent; color: #2B2018; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="16" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
    <button aria-label="New collection" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #E8821E; color: #3A1E00; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div style="flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 0">
    <p class="cap" style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#E8821E" aria-hidden="true"><path d="M9 3h6l-1 6.5 3 3V14H7v-1.5l3-3z"/></svg>Pinned · first three in the bar below</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{pinned}}" as="c" hint-placeholder-count="4">
        <article style="height: 176px; box-sizing: border-box; display: flex; flex-direction: column; padding: 14px 6px 14px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(74,48,20,.06), 0 4px 14px rgba(74,48,20,.05)">
          <div style="display: flex; align-items: flex-start">
            <span class="tile" style="width: 44px; height: 44px; background: {{c.bg}}; color: {{c.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg></span>
            <span style="flex: 1 1 auto"></span>
            <button aria-label="Unpin {{c.name}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #FCE9D6; color: #E8821E; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6.5 3 3V14H7v-1.5l3-3z"/><path d="M12 14v7" fill="none" stroke-linecap="round"/></svg></button>
            <button aria-label="More actions" style="width: 36px; height: 36px; border: 0; background: transparent; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
          </div>
          <span style="margin-top: 12px; font: 700 18px 'Bricolage Grotesque', sans-serif">{{c.name}}</span>
          <span style="flex: 1 1 auto"></span>
          <span style="font-size: 12px; font-weight: 600; color: #6B5E52">{{c.count}} fields</span>
        </article>
      </sc-for>
    </div>
    <p class="cap" style="padding-top: 10px">Everything else</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{others}}" as="c" hint-placeholder-count="4">
        <article style="height: 176px; box-sizing: border-box; display: flex; flex-direction: column; padding: 14px 6px 14px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(74,48,20,.06), 0 4px 14px rgba(74,48,20,.05)">
          <div style="display: flex; align-items: flex-start">
            <span class="tile" style="width: 44px; height: 44px; background: {{c.bg}}; color: {{c.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg></span>
            <span style="flex: 1 1 auto"></span>
            <button aria-label="Pin {{c.name}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6.5 3 3V14H7v-1.5l3-3z"/><path d="M12 14v7" fill="none" stroke-linecap="round"/></svg></button>
            <button aria-label="More actions" style="width: 36px; height: 36px; border: 0; background: transparent; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
          </div>
          <span style="margin-top: 12px; font: 700 18px 'Bricolage Grotesque', sans-serif">{{c.name}}</span>
          <span style="flex: 1 1 auto"></span>
          <span style="font-size: 12px; font-weight: 600; color: #6B5E52">{{c.count}} fields</span>
        </article>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="display: flex; padding: 0 8px 14px; background: #F4EDE3; border-top: 1px solid #E0D5C7">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button class="tab" aria-current="{{t.current}}" style="{{t.labelStyle}}">
        <span style="width: 56px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; {{t.pillStyle}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"/></svg></span>
        {{t.name}}
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const I = {
    box: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8',
    users: 'M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5',
    tag: 'M3 12V4h8l10 10-8 8zM7.5 7a1.5 1.5 0 1 1 0 3a1.5 1.5 0 1 1 0-3z',
    truck: 'M2 6h12v10H2zM14 10h4l3 3v3h-7M6 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM17 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4z',
    receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
    check: 'M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM8.5 12.5l2.5 2.5 4.5-5',
    building: 'M4 21V8l6-4v17M10 21V10l10 3v8M2 21h20',
    scissors: 'M6 4a3 3 0 1 1 0 6a3 3 0 1 1 0-6zM6 14a3 3 0 1 1 0 6a3 3 0 1 1 0-6zM8.5 8.5L20 19M8.5 15.5L20 5',
    grid: 'M6 4h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM15 4h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM6 13h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15 13h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z'
  };
  const T = {
    carrot: ['#FFE0C2', '#8A4708'], leaf: ['#E3EEDB', '#3B6128'], sky: ['#DCEAF3', '#2F5F80'],
    plum: ['#EDE0EE', '#6B3F70'], sand: ['#F6EBC8', '#6E5310'], rose: ['#F7DEDA', '#8A3328'],
    slate: ['#E6E2DC', '#4A4036'], teal: ['#D8EEEA', '#23605A']
  };
  const mk = (name, icon, tint, count) => ({ name, count, d: I[icon], bg: T[tint][0], fg: T[tint][1] });
  const tab = (name, icon, active) => ({
    name, d: I[icon], current: active ? 'page' : 'false',
    pillStyle: active ? 'background: #FFE0C2; color: #8A4708' : '',
    labelStyle: active ? 'color: #2B2018' : ''
  });
  return {
    pinned: [mk('Orders', 'box', 'carrot', 14), mk('Clients', 'users', 'leaf', 7), mk('Products', 'tag', 'sky', 9), mk('Deliveries', 'truck', 'plum', 6)],
    others: [mk('Invoices', 'receipt', 'sand', 8), mk('Tasks', 'check', 'rose', 5), mk('Suppliers', 'building', 'slate', 6), mk('Fabrics', 'scissors', 'teal', 12)],
    tabs: [tab('Orders', 'box'), tab('Clients', 'users'), tab('Products', 'tag'), tab('All', 'grid', true)]
  };
}
}
</script>
</body>
</html>
