<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar with pinned collections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 10px 0 8px;border-radius:14px;border:0;background:transparent;width:100%;text-align:left;font:600 14px 'Hanken Grotesk',sans-serif;color:#2B2018;box-sizing:border-box}
.tile{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.cnt{margin-left:auto;font:600 12px 'Hanken Grotesk',sans-serif;color:#6B5E52;font-variant-numeric:tabular-nums}
.cap{font:700 11px 'Hanken Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6B5E52;margin:0}
.ib{width:36px;height:36px;border-radius:12px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center}
.btn{height:44px;padding:0 18px;border-radius:12px;border:0;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Hanken Grotesk',sans-serif}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:16px;background:#FFFFFF;border:1px solid #EEE5D8;box-shadow:0 1px 2px rgba(74,48,20,.06),0 4px 14px rgba(74,48,20,.05);text-align:left;font-family:'Hanken Grotesk',sans-serif;color:#2B2018}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #FBF7F2; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018; overflow: hidden">

  <!-- Sidebar -->
  <nav aria-label="Main" style="width: 272px; flex: 0 0 272px; box-sizing: border-box; background: #F4EDE3; display: flex; flex-direction: column; padding: 16px 12px 12px; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 12px 6px">
      <span style="width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px; background: #E8821E; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(232,130,30,.35)">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5c2.6-1 8.3-5.6 10.3-8.6a2.7 2.7 0 0 0-3.7-3.7C8.1 9.2 3.5 14.9 2.5 17.5c-.4 1.1 1 2.4 2 2z" fill="#3A1E00"/><path d="M15.5 6.5l3.5-3.5M17 8.5l4-1.5M13.5 5l1.2-3.5" fill="none" stroke="#3A1E00" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto">
        <span style="font: 700 18px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.2px; line-height: 1.1">Morkva</span>
        <span style="font-size: 12px; color: #6B5E52; letter-spacing: 1.2px">CRM</span>
      </span>
    </div>

    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 12px; border-radius: 12px; border: 1px solid #E0D5C7; background: #FBF7F2; color: #6B5E52; font: 500 14px 'Hanken Grotesk', sans-serif; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="flex: 1 1 auto">Jump to…</span>
      <kbd style="font: 600 11px 'Hanken Grotesk', sans-serif; color: #6B5E52; background: #F4EDE3; border: 1px solid #E0D5C7; border-radius: 6px; padding: 2px 6px">Ctrl K</kbd>
    </button>

    <div style="height: 8px"></div>
    <button class="nav" aria-current="page" style="background: #FFFFFF; box-shadow: 0 1px 2px rgba(74,48,20,.08), 0 3px 10px rgba(74,48,20,.06)">
      <span class="tile" style="background: #E8821E; color: #3A1E00"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></span>
      All collections
    </button>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 6px 6px 10px">
      <p class="cap">Pinned</p>
    </div>
    <sc-for list="{{pinned}}" as="c" hint-placeholder-count="4">
      <button class="nav" style="{{c.rowStyle}}">
        <span class="tile" style="background: {{c.bg}}; color: {{c.fg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg></span>
        <span style="flex: 1 1 auto; font-weight: 500">{{c.name}}</span>
        <sc-if value="{{c.hover}}" hint-placeholder-val="{{false}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#B6A593" aria-label="Drag to reorder" role="img"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
        </sc-if>
      </button>
    </sc-for>
    <p style="margin: 6px 10px 0; font-size: 12px; line-height: 1.45; color: #6B5E52">Drag to reorder · right-click to unpin</p>

    <span style="flex: 1 1 auto"></span>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 6px 4px 8px; border-top: 1px solid #E0D5C7">
      <span style="width: 34px; height: 34px; flex: 0 0 34px; border-radius: 17px; background: #4C7A34; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 14px 'Hanken Grotesk', sans-serif">OK</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto">
        <span style="font-size: 14px; font-weight: 600">Olena Kovalenko</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #2E6B45"><span style="width: 7px; height: 7px; border-radius: 4px; background: #2E8B57"></span>Synced</span>
      </span>
      <button class="ib" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </nav>

  <!-- All collections page -->
  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: 32px 40px; gap: 24px; overflow: hidden">
    <header style="display: flex; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto">
        <h1 style="margin: 0; font: 700 32px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.6px">All collections</h1>
        <p style="margin: 0; font-size: 14px; color: #6B5E52">8 collections · 4 pinned to the sidebar</p>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; width: 280px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; border: 1px solid #B6A593; background: #FFFFFF; color: #6B5E52">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input aria-label="Filter collections" placeholder="Filter collections" style="border: 0; outline: 0; background: transparent; font: 500 14px 'Hanken Grotesk', sans-serif; color: #2B2018; flex: 1 1 auto; min-width: 0">
      </label>
      <button class="btn" style="background: #F4EDE3; color: #8A4708">From template</button>
      <button class="btn" style="background: #E8821E; color: #3A1E00"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New collection</button>
    </header>

    <section aria-labelledby="pinned-h" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#E8821E" stroke="#E8821E" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6.5 3 3V14H7v-1.5l3-3z"/><path d="M12 14v7" fill="none" stroke-linecap="round"/></svg>
        <h2 id="pinned-h" class="cap">Pinned</h2>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{pinned}}" as="c" hint-placeholder-count="4">
          <article class="card">
            <div style="display: flex; align-items: flex-start; justify-content: space-between">
              <span style="width: 48px; height: 48px; border-radius: 14px; background: {{c.bg}}; color: {{c.fg}}; display: inline-flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg></span>
              <span style="display: flex; gap: 2px"><button class="ib" aria-label="Unpin {{c.name}}" aria-pressed="true" style="color: #E8821E; background: #FFF3E6"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6.5 3 3V14H7v-1.5l3-3z"/><path d="M12 14v7" fill="none" stroke-linecap="round"/></svg></button><button class="ib" aria-label="More actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <h3 style="margin: 0; font: 700 18px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.2px">{{c.name}}</h3>
              <p style="margin: 0; font-size: 13px; line-height: 1.4; color: #6B5E52">{{c.desc}}</p>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6B5E52">
              {{c.fields}} fields
            </div>
          </article>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="other-h" style="display: flex; flex-direction: column; gap: 12px">
      <h2 id="other-h" class="cap">Everything else</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{others}}" as="c" hint-placeholder-count="4">
          <article class="card" style="{{c.cardStyle}}">
            <div style="display: flex; align-items: flex-start; justify-content: space-between">
              <span style="width: 48px; height: 48px; border-radius: 14px; background: {{c.bg}}; color: {{c.fg}}; display: inline-flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg></span>
              <span style="display: flex; gap: 2px"><button class="ib" aria-label="Pin {{c.name}}" aria-pressed="false" style="{{c.pinStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6.5 3 3V14H7v-1.5l3-3z"/><path d="M12 14v7" stroke-linecap="round"/></svg></button><button class="ib" aria-label="More actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <h3 style="margin: 0; font: 700 18px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.2px">{{c.name}}</h3>
              <p style="margin: 0; font-size: 13px; line-height: 1.4; color: #6B5E52">{{c.desc}}</p>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6B5E52">
              {{c.fields}} fields
            </div>
            <sc-if value="{{c.hover}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 58px; right: 10px; padding: 5px 9px; border-radius: 8px; background: #2B2018; color: #FBF7F2; font: 600 12px 'Hanken Grotesk', sans-serif">Pin to sidebar</span>
            </sc-if>
          </article>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const I = {
    box: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8',
    users: 'M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5',
    tag: 'M3 12V4h8l10 10-8 8zM7.5 7a1.5 1.5 0 1 1 0 3a1.5 1.5 0 1 1 0-3z',
    truck: 'M2 6h12v10H2zM14 10h4l3 3v3h-7M6 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM17 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4z',
    receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
    check: 'M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM8.5 12.5l2.5 2.5 4.5-5',
    building: 'M4 21V8l6-4v17M10 21V10l10 3v8M2 21h20',
    scissors: 'M6 4a3 3 0 1 1 0 6a3 3 0 1 1 0-6zM6 14a3 3 0 1 1 0 6a3 3 0 1 1 0-6zM8.5 8.5L20 19M8.5 15.5L20 5'
  };
  const T = {
    carrot: ['#FFE0C2', '#8A4708'], leaf: ['#E3EEDB', '#3B6128'], sky: ['#DCEAF3', '#2F5F80'],
    plum: ['#EDE0EE', '#6B3F70'], sand: ['#F6EBC8', '#6E5310'], rose: ['#F7DEDA', '#8A3328'],
    slate: ['#E6E2DC', '#4A4036'], teal: ['#D8EEEA', '#23605A']
  };
  const mk = (name, icon, tint, count, desc, updated, extra) => ({
    name, d: I[icon], bg: T[tint][0], fg: T[tint][1], fields: count, desc, updated, rowStyle: '', hover: false, ...extra
  });
  const pinned = [
    mk('Orders', 'box', 'carrot', 14, 'Embroidery orders from Instagram and the site', '2 min ago'),
    mk('Clients', 'users', 'leaf', 7, 'People who ordered at least once', '1 h ago', { hover: true, rowStyle: 'background: rgba(255,255,255,.55)' }),
    mk('Products', 'tag', 'sky', 9, 'Hoodies, tees and custom pieces with prices', 'Yesterday'),
    mk('Deliveries', 'truck', 'plum', 6, 'Nova Poshta parcels in transit', 'Today')
  ];
  const others = [
    mk('Invoices', 'receipt', 'sand', 8, 'Issued and paid invoices', '3 days ago', { cardStyle: '', pinStyle: '' }),
    mk('Tasks', 'check', 'rose', 5, 'Studio to-dos and follow-ups', 'Today', { hover: true, cardStyle: 'border-color: #E0D5C7; box-shadow: 0 2px 4px rgba(74,48,20,.08), 0 10px 24px rgba(74,48,20,.10)', pinStyle: 'background: #F4EDE3; color: #8A4708' }),
    mk('Suppliers', 'building', 'slate', 6, 'Thread, blanks and packaging vendors', 'Last week', { cardStyle: '', pinStyle: '' }),
    mk('Fabrics', 'scissors', 'teal', 12, 'Stock of fabric by colour and roll', '2 weeks ago', { cardStyle: '', pinStyle: '' })
  ];
  return { pinned, others };
}
}
</script>
</body>
</html>
