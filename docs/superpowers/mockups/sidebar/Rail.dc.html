<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.rb{position:relative;width:52px;height:52px;border-radius:16px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#6B5E52}
.tile{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center}
.cap{font:700 11px 'Hanken Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6B5E52;margin:0}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 6px 0 8px;border-radius:12px;font:500 14px 'Hanken Grotesk',sans-serif;color:#2B2018}
.ib{width:36px;height:36px;border-radius:12px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center}
.td{padding:0 16px;height:48px;border-bottom:1px solid #F4EDE3;font-size:14px;text-align:left}
</style>
</helmet>
<div style="position: relative; width: 1024px; height: 800px; display: flex; background: #FBF7F2; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018; overflow: hidden">

  <!-- Compact rail -->
  <nav aria-label="Main" style="width: 76px; flex: 0 0 76px; background: #F4EDE3; display: flex; flex-direction: column; align-items: center; padding: 16px 0 12px; gap: 6px; box-sizing: border-box">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #E8821E; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(232,130,30,.35); margin-bottom: 10px">
      <svg width="24" height="24" viewBox="0.15 -1.9 24 24" aria-hidden="true"><path d="M4.5 19.5c2.6-1 8.3-5.6 10.3-8.6a2.7 2.7 0 0 0-3.7-3.7C8.1 9.2 3.5 14.9 2.5 17.5c-.4 1.1 1 2.4 2 2z" fill="#3A1E00"/><path d="M15.5 6.5l3.5-3.5M17 8.5l4-1.5M13.5 5l1.2-3.5" fill="none" stroke="#3A1E00" stroke-width="1.8" stroke-linecap="round"/></svg>
    </span>
    <button class="rb" aria-label="Jump to"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="rb" aria-label="All collections"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
    <span style="width: 28px; height: 1px; background: #E0D5C7; margin: 8px 0"></span>
    <sc-for list="{{pinned}}" as="c" hint-placeholder-count="4">
      <button class="rb" aria-label="{{c.name}}" aria-current="{{c.current}}">
        <span class="tile" style="{{c.tileStyle}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg></span>
        <sc-if value="{{c.active}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; left: -12px; top: 16px; width: 5px; height: 20px; border-radius: 3px; background: #E8821E"></span>
        </sc-if>
      </button>
    </sc-for>
    <span style="flex: 1 1 auto"></span>
    <button class="rb" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <span style="position: relative; width: 36px; height: 36px; border-radius: 18px; background: #4C7A34; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 13px 'Hanken Grotesk', sans-serif">OK<span style="position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 5px; background: #2E8B57; border: 2px solid #F4EDE3"></span></span>
  </nav>

  <!-- Orders collection (the grid button opens All collections) -->
  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: 24px 32px; gap: 20px">
    <header style="display: flex; align-items: center; gap: 12px">
      <span class="tile" style="width: 40px; height: 40px; background: #FFE0C2; color: #8A4708"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg></span>
      <h1 style="margin: 0; font: 700 26px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.4px">Orders</h1>
      <span style="font-size: 14px; color: #6B5E52">142 cards</span>
    </header>
    <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #EEE5D8; overflow: hidden">
      <table style="width: 100%; border-collapse: collapse; font-family: 'Hanken Grotesk', sans-serif">
        <thead><tr style="background: #FAF4EC; color: #6B5E52; font-size: 12px"><th class="td" style="font-weight: 600">Order</th><th class="td" style="font-weight: 600">Client</th><th class="td" style="font-weight: 600">Status</th><th class="td" style="font-weight: 600">Total</th></tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <tr><td class="td" style="font-weight: 600">{{r.id}}</td><td class="td">{{r.client}}</td><td class="td"><span style="display: inline-flex; height: 24px; align-items: center; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #F4EDE3; color: #4A3C30">{{r.status}}</span></td><td class="td" style="font-variant-numeric: tabular-nums">{{r.total}}</td></tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":800}}'>
class Component extends DCLogic {
renderVals() {
  const I = {
    box: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8',
    users: 'M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5',
    tag: 'M3 12V4h8l10 10-8 8zM7.5 7a1.5 1.5 0 1 1 0 3a1.5 1.5 0 1 1 0-3z',
    truck: 'M2 6h12v10H2zM14 10h4l3 3v3h-7M6 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM17 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4z',
    receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
    check: 'M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM8.5 12.5l2.5 2.5 4.5-5',
    building: 'M4 21V8l6-4v17M10 21V10l10 3v8M2 21h20',
    scissors: 'M6 4a3 3 0 1 1 0 6a3 3 0 1 1 0-6zM6 14a3 3 0 1 1 0 6a3 3 0 1 1 0-6zM8.5 8.5L20 19M8.5 15.5L20 5'
  };
  const T = {
    carrot: ['#FFE0C2', '#8A4708'], leaf: ['#E3EEDB', '#3B6128'], sky: ['#DCEAF3', '#2F5F80'],
    plum: ['#EDE0EE', '#6B3F70'], sand: ['#F6EBC8', '#6E5310'], rose: ['#F7DEDA', '#8A3328'],
    slate: ['#E6E2DC', '#4A4036'], teal: ['#D8EEEA', '#23605A']
  };
  const mk = (name, icon, tint, count, active) => ({
    name, count, d: I[icon], bg: T[tint][0], fg: T[tint][1], active: !!active,
    current: active ? 'page' : 'false',
    tileStyle: 'background: ' + T[tint][0] + '; color: ' + T[tint][1] + (active ? '; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #E8821E' : ''),
    rowStyle: active ? 'background: #FFF3E6' : ''
  });
  return {
    pinned: [mk('Orders', 'box', 'carrot', 142, true), mk('Clients', 'users', 'leaf', 86), mk('Products', 'tag', 'sky', 38), mk('Deliveries', 'truck', 'plum', 12)],
    others: [mk('Invoices', 'receipt', 'sand', 64), mk('Tasks', 'check', 'rose', 23), mk('Suppliers', 'building', 'slate', 9), mk('Fabrics', 'scissors', 'teal', 31)],
    rows: [
      { id: 'ORD-0142', client: 'Olena Shevchuk', status: 'In progress', total: '₴1 850' },
      { id: 'ORD-0141', client: 'Taras Melnyk', status: 'New', total: '₴960' },
      { id: 'ORD-0140', client: 'Iryna Bondar', status: 'Shipped', total: '₴2 400' },
      { id: 'ORD-0139', client: 'Andrii Koval', status: 'In progress', total: '₴1 200' },
      { id: 'ORD-0138', client: 'Sofia Lysenko', status: 'Done', total: '₴780' },
      { id: 'ORD-0137', client: 'Maksym Tkachenko', status: 'Shipped', total: '₴3 150' },
      { id: 'ORD-0136', client: 'Kateryna Hnatiuk', status: 'Done', total: '₴1 090' },
      { id: 'ORD-0135', client: 'Dmytro Savchuk', status: 'New', total: '₴640' }
    ]
  };
}
}
</script>
</body>
</html>
