<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Morkva — phone entry point</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-bottom:1px solid #EEE5D8;background:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FBF7F2; font-family: 'Hanken Grotesk','Onest', sans-serif; color: #2B2018; position: relative">
  <header style="display: flex; align-items: center; gap: 2px; height: 60px; padding: 0 4px 0 16px">
    <span style="flex: 1 1 auto; font: 700 20px 'Bricolage Grotesque','Onest', sans-serif">Orders</span>
    <button class="ib" aria-label="Ask Morkva" style="color: #8A4708; background: #FFE0C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5zM19 15.5c.3 2 1.2 2.9 3.2 3.2-2 .3-2.9 1.2-3.2 3.2-.3-2-1.2-2.9-3.2-3.2 2-.3 2.9-1.2 3.2-3.2z"/></svg></button>
    <button class="ib" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </header>
  <div style="flex: 1 1 auto; overflow: hidden; border-top: 1px solid #EEE5D8">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div class="row"><span style="display: flex; flex-direction: column; flex: 1 1 auto"><span style="font-weight: 600; font-size: 15px">{{r.client}}</span><span style="font-size: 13px; color: #6B5E52">#{{r.n}} · {{r.status}}</span></span><span style="font-variant-numeric: tabular-nums">{{r.total}}</span></div>
    </sc-for>
  </div>
  <button style="position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px; border-radius: 18px; border: 0; background: #E8821E; color: #3A1E00; display: inline-flex; align-items: center; gap: 8px; font: 700 15px 'Hanken Grotesk','Onest', sans-serif; box-shadow: 0 6px 18px rgba(232,130,30,.35)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New order</button>
  <nav aria-label="Collections" style="display: flex; height: 80px; background: #F4EDE3; border-top: 1px solid #E0D5C7">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #2B2018; font: 600 12px 'Hanken Grotesk','Onest', sans-serif"><span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.bg}}; display: inline-flex; align-items: center; justify-content: center"><span style="width: 16px; height: 16px; border-radius: 5px; background: {{t.dot}}"></span></span>{{t.name}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const tabs = [['Orders', '#FFE0C2', '#8A4708'], ['Clients', 'transparent', '#3B6128'], ['Products', 'transparent', '#2F5F80'], ['All', 'transparent', '#4A4036']].map(([name, bg, dot]) => ({ name, bg, dot }));
  return { tabs, rows: [
    { n: '1042', client: 'Iryna Melnyk', status: 'Packing', total: '₴ 2 150' },
    { n: '1041', client: 'Taras Bondar', status: 'New', total: '₴ 1 320' },
    { n: '1040', client: 'Oksana Lysenko', status: 'Packing', total: '₴ 1 980' },
    { n: '1039', client: 'Dmytro Shevchuk', status: 'Shipped', total: '₴ 2 700' },
    { n: '1038', client: 'Sofia Kravets', status: 'Packing', total: '₴ 1 640' },
    { n: '1037', client: 'Andrii Hnatyuk', status: 'New', total: '₴ 2 750' },
    { n: '1036', client: 'Mariia Tkachenko', status: 'Done', total: '₴ 1 100' },
    { n: '1035', client: 'Petro Savchuk', status: 'Done', total: '₴ 890' }
  ] };
}
}
</script>
</body>
</html>
