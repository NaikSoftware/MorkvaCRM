<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Morkva — phone, streaming</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center}
.step{display:flex;align-items:center;gap:8px;font-size:12px;color:#6B5E52;height:24px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Hanken Grotesk','Onest', sans-serif; color: #2B2018">
  <header style="display: flex; align-items: center; gap: 4px; height: 60px; padding: 0 6px; border-bottom: 1px solid #EEE5D8">
    <button class="ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span style="display: flex; flex-direction: column; flex: 1 1 auto"><span style="font: 700 17px 'Bricolage Grotesque','Onest', sans-serif">Ask Morkva</span><span style="font-size: 12px; color: #6B5E52">Low stock fabrics</span></span>
    <button class="ib" aria-label="Conversation history"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4M12 8v4l3 2"/></svg></button>
  </header>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 16px; background: #FBF7F2; overflow: hidden">
    <div style="align-self: flex-end; max-width: 85%; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: #EEE5D8; color: #2B2018; font-size: 15px; line-height: 1.45">Which fabrics are running low?</div>

    <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #EEE5D8">
      <div class="step"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2E8B57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Read the Fabrics schema</div>
      <div class="step"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E8821E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg><span style="color: #2B2018; font-weight: 600">Filtering 36 fabrics where Metres left &lt; 5…</span></div>
    </div>

    <p style="margin: 0; font-size: 15px; line-height: 1.55">Four fabrics are under 5 metres. The lowest is <b>Linen, sand</b> with 1.2 m — and it's in two open orders<span style="display: inline-block; width: 8px; height: 16px; margin-left: 2px; vertical-align: -2px; border-radius: 2px; background: #E8821E"></span></p>
  </div>

  <footer style="padding: 10px 12px 18px; border-top: 1px solid #EEE5D8; display: flex; flex-direction: column; gap: 8px">
    <label style="display: flex; align-items: flex-end; gap: 8px; min-height: 52px; padding: 6px 6px 6px 14px; box-sizing: border-box; border-radius: 18px; border: 1px solid #B6A593; background: #FFFFFF">
      <textarea aria-label="Message Morkva" rows="1" placeholder="Ask a follow-up…" style="flex: 1 1 auto; border: 0; outline: 0; resize: none; font: 500 15px 'Hanken Grotesk','Onest', sans-serif; color: #2B2018; padding: 10px 0; background: transparent"></textarea>
      <button aria-label="Stop generating" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; border: 0; background: #2B2018; color: #FBF7F2; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
    </label>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
