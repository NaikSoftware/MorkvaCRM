<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Morkva — first open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center}
.cap{font:700 11px 'Hanken Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6B5E52;margin:0}
.sug{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:14px;border:1px solid #EEE5D8;background:#FFFFFF;text-align:left;font:500 14px 'Hanken Grotesk',sans-serif;color:#2B2018;width:100%;box-sizing:border-box}
.ico{width:30px;height:30px;flex:0 0 30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018; border-left: 1px solid #EEE5D8">
  <header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 10px 0 18px; border-bottom: 1px solid #EEE5D8">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#E8821E" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5zM19 15.5c.3 2 1.2 2.9 3.2 3.2-2 .3-2.9 1.2-3.2 3.2-.3-2-1.2-2.9-3.2-3.2 2-.3 2.9-1.2 3.2-3.2z"/></svg>
    <span style="flex: 1 1 auto; font: 700 16px 'Bricolage Grotesque', sans-serif">Ask Morkva</span>
    <button class="ib" aria-label="Conversation history"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4M12 8v4l3 2"/></svg></button>
    <button class="ib" aria-label="Close assistant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px; padding: 36px 22px 16px; background: #FBF7F2; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="width: 52px; height: 52px; border-radius: 16px; background: #2B2018; display: inline-flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="#F59B3C" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5zM19 15.5c.3 2 1.2 2.9 3.2 3.2-2 .3-2.9 1.2-3.2 3.2-.3-2-1.2-2.9-3.2-3.2 2-.3 2.9-1.2 3.2-3.2z"/></svg></span>
      <h2 style="margin: 0; font: 700 26px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.4px; line-height: 1.15">Hi Olena. What should we look at?</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #6B5E52">I can read all 8 of your collections, crunch numbers, and make changes — you approve every change before it happens.</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 class="cap">Ask</h3>
      <button class="sug"><span class="ico" style="background: #DCEAF3; color: #2F5F80"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>Which orders are waiting for payment?</button>
      <button class="sug"><span class="ico" style="background: #DCEAF3; color: #2F5F80"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>Who are my top 5 clients by spend?</button>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 class="cap">Analyze</h3>
      <button class="sug"><span class="ico" style="background: #E3EEDB; color: #3B6128"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Revenue by month this year</button>
      <button class="sug"><span class="ico" style="background: #E3EEDB; color: #3B6128"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Which fabrics are running low?</button>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 class="cap">Act</h3>
      <button class="sug"><span class="ico" style="background: #FFE0C2; color: #8A4708"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>Add a Suppliers collection linked to Fabrics</button>
      <button class="sug"><span class="ico" style="background: #FFE0C2; color: #8A4708"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>Move all delivered orders to Done</button>
    </section>
  </div>

  <footer style="padding: 10px 14px 14px; border-top: 1px solid #EEE5D8; display: flex; flex-direction: column; gap: 8px">
    <label style="display: flex; align-items: flex-end; gap: 8px; min-height: 52px; padding: 4px 4px 4px 14px; box-sizing: border-box; border-radius: 16px; border: 2px solid #8A4708; background: #FFFFFF">
      <textarea aria-label="Message Morkva" rows="1" placeholder="Ask about your data, or tell me what to change…" style="flex: 1 1 auto; border: 0; outline: 0; resize: none; font: 500 14px 'Hanken Grotesk', sans-serif; color: #2B2018; padding: 12px 0; background: transparent"></textarea>
      <button aria-label="Send" disabled style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px; border: 0; background: #EEE5D8; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
    </label>
    <p style="margin: 0; font-size: 12px; color: #6B5E52; text-align: center">Answers can be wrong — check important numbers.</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
