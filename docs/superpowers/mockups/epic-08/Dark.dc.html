<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Morkva — dark theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#1A1410}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#C3B6A6;display:inline-flex;align-items:center;justify-content:center}
.btn{height:44px;padding:0 14px;border-radius:12px;border:0;display:inline-flex;align-items:center;gap:8px;font:600 14px 'Hanken Grotesk',sans-serif}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:#3A2A1A;color:#F5C08A;font:600 12px 'Hanken Grotesk',sans-serif;text-decoration:none}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font:600 12px 'Hanken Grotesk',sans-serif}
</style>
</helmet>
<div style="width: 440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #241D17; font-family: 'Hanken Grotesk', sans-serif; color: #F3EBE0; border-left: 1px solid #4A4036">
  <header style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px 0 18px; border-bottom: 1px solid #4A4036">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#F59B3C" aria-hidden="true"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5z"/></svg>
    <span style="flex: 1 1 auto; font: 700 16px 'Bricolage Grotesque', sans-serif">Ask Morkva</span>
    <button class="ib" aria-label="Conversation history"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4M12 8v4l3 2"/></svg></button>
    <button class="ib" aria-label="Close assistant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #1A1410; overflow: hidden">
    <div style="align-self: flex-end; max-width: 82%; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: #3A3028; color: #F3EBE0; font-size: 14px; line-height: 1.45">The three going by Nova Poshta are packed — mark them Shipped.</div>
    <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid #4A4036; color: #C3B6A6; font: 600 12px 'Hanken Grotesk', sans-serif">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5FC48A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Found 3 orders in Orders
    </div>
    <section aria-label="Proposed changes" style="border-radius: 16px; background: #241D17; border: 2px solid #F59B3C; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px 8px">
        <span style="font: 700 14px 'Hanken Grotesk', sans-serif">Set Status to Shipped · 3 orders</span>
        <span style="font-size: 12px; color: #C3B6A6">Nothing changes until you approve. You can undo afterwards.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; font-size: 13px">
        <span style="color: #C3B6A6">Status</span>
        <span class="pill" style="background: #3D3418; color: #EBD58C; text-decoration: line-through">Packing</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C3B6A6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span class="pill" style="background: #24361B; color: #A9D98C">Shipped</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-top: 1px solid #332A22; font-size: 13px"><input type="checkbox" checked aria-label="Include order {{r.n}}" style="width: 18px; height: 18px; accent-color: #F59B3C; margin: 0"><a href="#" class="chip">#{{r.n}}</a><span style="flex: 1 1 auto; font-weight: 600">{{r.client}}</span></label>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid #332A22; background: #1E1813">
        <span style="flex: 1 1 auto"></span>
        <button class="btn" style="background: transparent; color: #F5C08A">Reject</button>
        <button class="btn" style="background: #F59B3C; color: #3A1E00">Approve 3 changes</button>
      </div>
    </section>
    <section aria-label="Proposed deletion" style="border-radius: 16px; background: #241D17; border: 2px solid #E6786B; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <span style="font: 700 14px 'Hanken Grotesk', sans-serif">Delete 7 orders</span>
      <span style="font-size: 12px; color: #F0A99F">You can undo this for 10 minutes.</span>
      <div style="display: flex; gap: 8px; justify-content: flex-end"><button class="btn" style="background: transparent; color: #F3EBE0">Keep them</button><button class="btn" style="background: #E6786B; color: #2B0E09">Delete 7 orders</button></div>
    </section>
  </div>
  <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; min-height: 48px; background: #3A2F12; border-top: 1px solid #5A4A1C; font-size: 13px; color: #F1DC9A">
    <span style="flex: 1 1 auto">Gemini is busy. Retrying in 20 s.</span>
    <button class="btn" style="background: transparent; color: #F1DC9A; font-size: 13px">Retry now</button>
  </div>
  <footer style="padding: 10px 14px 14px; border-top: 1px solid #4A4036">
    <label style="display: flex; align-items: flex-end; gap: 8px; min-height: 52px; padding: 4px 4px 4px 14px; box-sizing: border-box; border-radius: 16px; border: 1px solid #8C7E70; background: #1A1410">
      <textarea aria-label="Message Morkva" rows="1" placeholder="Ask a follow-up…" style="flex: 1 1 auto; border: 0; outline: 0; resize: none; font: 500 14px 'Hanken Grotesk', sans-serif; color: #F3EBE0; padding: 12px 0; background: transparent"></textarea>
      <button aria-label="Send" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px; border: 0; background: #332A22; color: #C3B6A6; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
    </label>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  return { rows: [ { n: '1042', client: 'Iryna Melnyk' }, { n: '1040', client: 'Oksana Lysenko' }, { n: '1038', client: 'Sofia Kravets' } ] };
}
}
</script>
</body>
</html>
