<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculated field — lookup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.lbl{font:600 13px 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52;margin:0}
.field{min-height:48px;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid #B6A593;background:#FFFFFF;display:flex;align-items:center;gap:8px;font:500 15px 'Hanken Grotesk','Onest',sans-serif;color:#2B2018}
.seg{flex:1 1 0;height:40px;border:0;background:transparent;font:600 14px 'Hanken Grotesk','Onest',sans-serif;color:#6B5E52;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font:600 12px 'Hanken Grotesk','Onest',sans-serif}
</style>
</helmet>
<div style="width: 440px; height: 900px; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #E0D5C7; font-family: 'Hanken Grotesk','Onest', sans-serif; color: #2B2018; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid #F4EDE3">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFE0C2; color: #8A4708; display: inline-flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto">
      <h2 style="margin: 0; font: 700 20px 'Bricolage Grotesque','Onest', sans-serif">Order status</h2>
      <span style="font-size: 13px; color: #6B5E52">Calculated · Single select</span>
    </div>
    <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #6B5E52; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>

  <div style="flex: 1 1 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
    <div role="radiogroup" aria-label="Calculate with" style="display: flex; padding: 4px; border-radius: 24px; background: #F4EDE3; gap: 4px">
      <button class="seg" role="radio" aria-checked="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 5H7l5 7-5 7h11"/></svg>Formula</button>
      <button class="seg" role="radio" aria-checked="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Aggregate</button>
      <button class="seg" role="radio" aria-checked="true" style="background: #FFFFFF; color: #2B2018; box-shadow: 0 1px 2px rgba(43,32,24,.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Lookup</button>
    </div>
    <p style="margin: -8px 0 0; font-size: 13px; color: #6B5E52">Shows a field of the linked item, like VLOOKUP.</p>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="via">Through</label>
      <div class="field" id="via" style="justify-content: space-between">
        <span style="display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 7l5 5-5 5"/><path d="M14 12H4"/></svg>
          Order <span style="color: #6B5E52">· links to Orders</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="show">Show</label>
      <div class="field" id="show" style="justify-content: space-between">
        <span style="display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
          Status
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <p style="margin: 0; font-size: 13px; color: #6B5E52">Keeps its type: a select stays a select, so filters and totals can use its options.</p>
    </div>

    <div style="padding: 16px; border-radius: 16px; background: #F7F1EA; display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; font: 600 11px 'Hanken Grotesk','Onest', sans-serif; letter-spacing: .4px; color: #6B5E52">IN WORDS</p>
      <p style="margin: 0; font-size: 15px">Status of the linked order (Order)</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
