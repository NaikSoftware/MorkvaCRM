<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board with collapsed columns</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.ib{width:32px;height:32px;border-radius:16px;border:0;background:transparent;color:#6B5E52;display:inline-flex;align-items:center;justify-content:center;padding:0}
.card{background:#FFFFFF;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,0.08),0 2px 6px rgba(74,53,32,0.06)}
</style>
</helmet>
<div style="width: 1280px; height: 820px; overflow: hidden; background: #FBF7F2; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #2B2018; padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font: 700 32px 'Bricolage Grotesque', sans-serif">Orders</h1>
    <span style="font-size: 13px; color: #6B5E52">Collapsed columns are remembered per view</span>
  </div>
  <div style="display: flex; gap: 16px; align-items: flex-start; flex: 1 1 auto; min-height: 0">

    <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
      <sc-if value="{{c.collapsed}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-label="Expand {{c.name}}, {{c.count}} orders" style="flex: 0 0 48px; align-self: stretch; max-height: 520px; border: 0; border-radius: 16px; background: #F4EDE3; padding: 8px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; font-family: 'Hanken Grotesk', sans-serif; color: #2B2018; cursor: pointer">
          <span class="ib" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6M7 9l3 3-3 3M20 12h-6M17 9l-3 3 3 3"></path></svg></span>
          <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: {{c.dot}}"></span>
          <span style="min-width: 24px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; font: 600 12px 'Hanken Grotesk', sans-serif; color: #2B2018; display: inline-flex; align-items: center; justify-content: center">{{c.count}}</span>
          <span style="writing-mode: vertical-rl; font: 500 16px 'Bricolage Grotesque', sans-serif; white-space: nowrap">{{c.name}}</span>        </button>
      </sc-if>
      <sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
        <section aria-label="{{c.name}}" style="flex: 0 0 272px; background: #F4EDE3; border-radius: 16px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px; padding: 0 0 0 4px">
            <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: {{c.dot}}"></span>
            <h2 style="margin: 0; flex: 1 1 auto; font: 500 16px 'Bricolage Grotesque', sans-serif">{{c.name}}</h2>
            <span style="font-size: 12px; font-weight: 600; color: #6B5E52">{{c.count}}</span>
            <button type="button" class="ib" aria-label="Add to {{c.name}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
            <button type="button" class="ib" aria-label="Collapse {{c.name}}" title="Collapse"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h6M6 9l3 3-3 3M21 12h-6M18 9l-3 3 3 3"></path></svg></button>
          </div>
          <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
            <article class="card">
              <div style="display: flex; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 15px; font-weight: 600">{{k.t}}</h3><span style="font-size: 13px; font-weight: 600; color: #6B5E52">{{k.n}}</span></div>
              <span style="align-self: flex-start; padding: 2px 8px; border-radius: 8px; background: #F4EDE3; font-size: 12px; font-weight: 500; color: #6B5E52">{{k.d}}</span>
            </article>
          </sc-for>
        </section>
      </sc-if>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    function col(name, dot, cards, collapsed) {
      var n = cards.length;
      return { name: name, dot: dot, count: String(n), summary: n === 0 ? 'No orders' : n + (n === 1 ? ' order' : ' orders'), collapsed: !!collapsed, open: !collapsed,
        cards: cards.map(function (c) { return { t: c[0], n: c[1], d: c[2] }; }) };
    }
    return { cols: [
      col('New', '#3A7CA5', [['@olena.handmade', 'ORD-1', 'Nov 20'], ['@anna.knits', 'ORD-17', 'Oct 29'], ['@zoriana.books', 'ORD-25', 'Nov 1']]),
      col('Ordered goods', '#6B5E52', [['@pavlo_travel', 'ORD-18', ''], ['@bohdan.coffee', 'ORD-10', ''], ['@vasyl_wood', 'ORD-26', ''], ['@max_kyiv', 'ORD-2', '']], true),
      col('In work', '#E8821E', [['@daria.photo', 'ORD-21', 'Nov 7'], ['@nataliia.home', 'ORD-13', 'Nov 4']]),
      col('Shipped', '#6B5E52', [['a', '', ''], ['b', '', ''], ['c', '', '']], true),
      col('Not picked up', '#6B5E52', [], true)
    ] };
  }
}
</script>
</body>
</html>
