<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save blocked by inline errors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FBF7F2}
.lbl{display:flex;align-items:center;gap:6px;font:600 13px 'Hanken Grotesk',sans-serif;color:#6B5E52}
.box{min-height:48px;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid #B6A593;background:#FFFFFF;display:flex;align-items:center;gap:8px;font:500 15px 'Hanken Grotesk',sans-serif;color:#2B2018}
.help{font:400 12px 'Hanken Grotesk',sans-serif;color:#6B5E52}
.err{display:flex;align-items:center;gap:6px;font:500 12px 'Hanken Grotesk',sans-serif;color:#A8321F}
</style>
</helmet>
<div style="width: 1280px; height: 820px; position: relative; overflow: hidden; background: #8F8378; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #2B2018">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 720px; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 64px; color: #FBF7F2">
    <div style="font: 700 28px 'Bricolage Grotesque', sans-serif">Save pressed with problems</div>
    <div style="font-size: 16px; max-width: 46ch; line-height: 1.5">Nothing is written. Every field now shows its errors, the form scrolls to the first one, and the banner counts what is left. Errors clear as each field is fixed.</div>
  </div>
  <aside role="dialog" aria-labelledby="t2" style="position: absolute; top: 0; right: 0; bottom: 0; width: 560px; background: #FBF7F2; box-shadow: -10px 0 32px rgba(43,32,24,0.18); display: flex; flex-direction: column">
    <header style="display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 16px 24px; border-bottom: 1px solid #E0D5C7">
      <span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #FFE0C2"></span>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
        <h1 id="t2" style="margin: 0; font: 700 22px/1.25 'Bricolage Grotesque', sans-serif; color: #6B5E52">New deal</h1>
        <span class="help">Deals</span>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #2B2018; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </header>
    <div role="alert" style="margin: 16px 24px 0; padding: 12px 14px; border-radius: 12px; background: #FBE3DF; color: #6E1D12; display: flex; align-items: center; gap: 10px; font: 600 14px 'Hanken Grotesk', sans-serif">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
      Fix 2 fields to save
    </div>
    <div style="flex: 1 1 auto; overflow: auto; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 18px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span class="lbl">Name <span style="color: #C0392B">*</span></span>
        <input type="text" value="" placeholder="" class="box" style="border: 2px solid #C0392B; padding: 0 13px; outline: none">
        <span class="err"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>Name is required</span>
      </label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span class="lbl">Amount</span>
          <span class="box" style="border: 2px solid #C0392B; padding: 0 13px"><span style="flex: 1 1 auto">12,3a</span><span style="color: #6B5E52; font-size: 14px">USD</span></span>
          <span class="err"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>Enter a number</span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span class="lbl">Probability</span>
          <span class="box"><span style="flex: 1 1 auto">40</span><span style="color: #6B5E52; font-size: 14px">%</span></span>
          <span class="help">0 – 100</span>
        </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span class="lbl">Summary</span>
        <span class="box" style="min-height: 96px; align-items: flex-start; padding-top: 12px; color: #2B2018">Expansion of the support plan to three more sites.</span>
        <span class="help" style="text-align: right; font-variant-numeric: tabular-nums">49 / 280</span>
      </label>
      <div role="status" style="padding: 12px 14px; border-radius: 12px; background: #F8EBC4; color: #4A3600; display: flex; align-items: flex-start; gap: 10px; font: 500 13px/1.45 'Hanken Grotesk', sans-serif">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
        <span><b>Stage was changed elsewhere.</b> Saving will overwrite it with your value.</span>
      </div>
    </div>
    <footer style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid #E0D5C7">
      <span style="flex: 1 1 auto"></span>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: transparent; color: #8A4708; font: 600 14px 'Hanken Grotesk', sans-serif">Cancel</button>
      <button type="button" style="height: 44px; padding: 0 24px; border-radius: 22px; border: 0; background: #E8821E; color: #3A1E00; font: 600 14px 'Hanken Grotesk', sans-serif">Save</button>
    </footer>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
