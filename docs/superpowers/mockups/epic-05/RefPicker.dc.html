<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reference picker — link contacts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#8F8378}
</style>
</helmet>
<div style="width: 1280px; height: 820px; position: relative; overflow: hidden; background: #8F8378; font-family: 'Hanken Grotesk','Onest', system-ui, sans-serif; color: #2B2018; display: flex; align-items: center; justify-content: center">
  <div role="dialog" aria-labelledby="rp" style="width: 520px; max-height: 640px; background: #FBF7F2; border-radius: 28px; box-shadow: 0 10px 24px rgba(0,0,0,0.14), 0 24px 48px rgba(82,58,34,0.18); display: flex; flex-direction: column; overflow: hidden">
    <div style="padding: 24px 24px 12px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <h2 id="rp" style="margin: 0; flex: 1 1 auto; font: 700 22px 'Bricolage Grotesque','Onest', sans-serif">Link contacts</h2>
        <span style="font: 500 13px 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">from Contacts</span>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 24px; background: #FFFFFF; border: 2px solid #E8821E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5E52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
        <span style="position: absolute; left: -9999px">Search contacts</span>
        <input type="search" value="an" style="flex: 1 1 auto; border: 0; outline: none; background: transparent; font: 500 15px 'Hanken Grotesk','Onest', sans-serif; color: #2B2018">
        <span style="font: 500 12px 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">4 of 23</span>
      </label>
    </div>
    <ul style="list-style: none; margin: 0; padding: 4px 12px 8px; overflow: auto; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <li>
          <label style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 12px; border-radius: 14px; background: {{it.bg}}">
            <input type="checkbox" checked="{{it.on}}" style="width: 20px; height: 20px; accent-color: #E8821E; flex: none">
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font: 600 15px 'Hanken Grotesk','Onest', sans-serif">{{it.name}}</span>
              <span style="font: 400 13px 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">{{it.sub}}</span>
            </span>
          </label>
        </li>
      </sc-for>
    </ul>
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px 20px; border-top: 1px solid #E0D5C7">
      <span style="flex: 1 1 auto; font: 500 13px 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">2 linked</span>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: transparent; color: #8A4708; font: 600 14px 'Hanken Grotesk','Onest', sans-serif">Cancel</button>
      <button type="button" style="height: 44px; padding: 0 24px; border-radius: 22px; border: 0; background: #E8821E; color: #3A1E00; font: 600 14px 'Hanken Grotesk','Onest', sans-serif">Done</button>
    </div>
  </div>
  <div style="position: absolute; left: 40px; bottom: 40px; width: 300px; padding: 20px; border-radius: 20px; background: #FBF7F2; display: flex; flex-direction: column; gap: 12px">
    <div style="font: 700 16px 'Bricolage Grotesque','Onest', sans-serif">Single link</div>
    <div style="font: 400 13px/1.45 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">No checkboxes: tapping a row links it and closes. The current link is marked with a check.</div>
    <div style="font: 700 16px 'Bricolage Grotesque','Onest', sans-serif; margin-top: 4px">Nothing found</div>
    <div style="height: 88px; border-radius: 14px; background: #F4EDE3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font: 600 14px 'Hanken Grotesk','Onest', sans-serif">No contacts match “zz”</span><span style="font: 400 12px 'Hanken Grotesk','Onest', sans-serif; color: #6B5E52">Try another name</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var d = [['Anna Kovalenko', 'Alpha Ltd · anna@alpha.example', true], ['Andrii Melnyk', 'Zeta Corp', false], ['Oksana Danylenko', 'Alpha Ltd', true], ['Bohdan Ivanenko', 'No company', false]];
    return { items: d.map(function (r) { return { name: r[0], sub: r[1], on: r[2], bg: r[2] ? '#FFF4E8' : 'transparent' }; }) };
  }
}
</script>
</body>
</html>
